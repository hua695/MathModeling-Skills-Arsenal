# Harness 模式各节点检查重点差异表（对齐 contest-orchestrator v4.18 H0-H9）
# 审查时必须先读取本文件，明确当前节点的必查项和选查项
# 论文辅助核心审查节点：H3（文献阅读）、H4（模型路线）、H5（解题）、H8（论文，含H8A/H8B/H8C）、H9（交付审计）
# 非核心节点（H0-H2、H6-H7）：只做材料完整性和一致性检查，不做深度审查

# 节点状态机：not_started → draft → review_pending → approved → frozen
# 证据不完整时使用 evidence_gap 并回流；输入缺失或用户批准缺失时使用 PAUSE
# H2-H9 每个节点完成后必须生成 review_packet，用户批准后才能进入下一节点

# 子 agent 模型路由（每张实际调度的任务卡必须显式填写 model 和 reasoning_effort）
# H1: gpt-5.6-terra, medium（题意理解）
# H5: gpt-5.6-sol, high（解题，唯一 solver_instance_id）
# H6: gpt-5.6-sol, high（验证，agent_instance_id 必须不同于 H5）
# H7: gpt-5.6-terra, medium（图表，分两阶段）
# H8: gpt-5.6-sol, high（论文，分 H8A/H8B/H8C 三子阶段）
# H0/H2/H3/H4/H9: controller_only，不调度固定子 agent
# luna 只允许不改变模型/结果/验证结论/论文论证的低风险辅助工作，不能替代 H5/H6/H8

H0:
  name: "激活门禁"
  review_scope: "非核心（材料完整性检查）"
  must_check:
    - "active_mode 是否明确为 full-contest-harness"
    - "Harness 硬门禁：H0 前是否实际调用 superpowers:using-superpowers，调用的 task ID 和完成状态是否登记到 harness_control.yaml.bootstrap.invocations"
    - "仅写技能名不构成调用记录；未调用、调用记录缺失时状态应为 BLOCKED_INPUT 或 PAUSE"
    - "是否登记固定角色、节点任务卡和调用记录"
    - "项目根是否创建 .contest/harness_control.yaml、.contest/task_cards/、.contest/reviews/、.contest/approval_log.yaml"
    - "是否使用 templates/harness_control.yaml 初始化项目控制记录"
  optional_check:
    - "项目目录结构是否规范"
  focus: "材料完整性 + harness 硬门禁"
  common_pitfalls:
    - "只写技能名不实际调用，调用记录缺失"
    - ".contest 目录结构不完整"
    - "未登记固定角色和节点任务卡"
    - "harness_control.yaml 未用模板初始化"

H1:
  name: "题意理解"
  review_scope: "非核心（输入包质量检查）"
  must_check:
    - "题意理解 agent（gpt-5.6-terra, medium）是否读取题面和附件"
    - "problem_statement.md 是否按双结构模板：上半部分完整题面翻译（保留背景、小问原文、公式LaTeX与全局约束），下半部分题目解读（每问目标/输入/输出/难点/前后关系）与歧义清单"
    - "unified_problem_package.yaml 是否包含：题意摘要、数据字典、约束、来源索引和不确定项"
    - "各小问读者问题线索是否齐全"
    - "题面预载：H1 产出后，主 agent 是否一次性创建 H5/H6/H7/H8 四个子 agent 实例，预载题面+对应预热包"
    - "H8 是否额外预载 h8_writer_first_protocol.md"
    - "spawn_roles 调用记录是否登记 skill=superpowers:using-superpowers、completed=true、after_node=H1、created 恰好为 H5/H6/H7/H8 且唯一"
  optional_check:
    - "歧义清单是否覆盖所有模糊表述"
    - "数据字典字段是否完整"
  focus: "题意产物完整性 + 子 agent 预载"
  common_pitfalls:
    - "题面翻译丢信息（背景、小问原文、公式、全局约束）"
    - "problem_statement.md 缺少双结构（只有翻译没有解读）"
    - "数据字典字段不完整"
    - "未一次性创建全部固定角色子 agent（H5/H6/H7/H8）"
    - "H8 未预载 h8_writer_first_protocol.md"
    - "spawn_roles 调用记录缺失或不完整"

H2:
  name: "规格冻结"
  review_scope: "非核心（冻结完整性检查）"
  must_check:
    - "主 agent（controller_only）是否生成规格冻结包"
    - "题目—数据—接口映射是否完整，每个小问的输入输出是否清晰"
    - "用户是否确认规格冻结（未确认不得进入 H3）"
    - "冻结的规格是否包含：假设清单、符号表、数据接口、约束条件"
    - "是否有未解决的歧义残留到建模阶段"
    - "是否生成 review_packet，写入 approval_log.yaml"
  optional_check:
    - "假设的依据是否充分"
    - "符号表是否覆盖所有题设变量"
  focus: "规格冻结完整性 + 用户批准"
  common_pitfalls:
    - "用户未确认就进入 H3"
    - "规格冻结不完整，缺少关键接口定义"
    - "歧义未解决就带入建模"
    - "未生成 review_packet 或 approval_log"

H3:
  name: "文献需求"
  review_scope: "核心（论文辅助作为外部文献阅读子 agent）"
  role: "外部文献阅读子 agent（主 agent 调用，主 agent 知道本 skill 存在）"
  must_check:
    - "主 agent（controller_only）是否生成文献需求清单和给外部文献 agent 的提示词"
    - "文献总数硬范围 6-11 篇，推荐 8-10 篇"
    - "中文文献必须逐小问覆盖，每个小问至少 1 篇"
    - "英文文献不设硬性最低数量，但建议覆盖全部小问（未覆盖只记录建议，不阻断）"
    - "需求清单是否包含：方法/数据/参数/基准证据需求、检索词、回传字段、'支持哪个小问和论点'"
    - "是否在本节点确定模型路线、模型蓝图、baseline 或图表需求清单（越权，禁止）"
    - "用户是否检索下载全文并提交 literature_sources.yaml"
    - "每篇文献是否有 citation_key、原文定位及在 H4 落位的实际用途"
    - "每篇回传 12 个字段：title, authors, venue, year, doi_or_url, abstract, full_text_summary, method_summary, data_summary, limitations, evidence_locators, candidate_questions"
    - "doi_or_url 必须是 DOI 或官方链接，禁止博客、搜索结果页、竞赛题面"
    - "evidence_locators 必须包含页码/章节/公式编号/图表编号"
    - "禁止做模型路线决策、方法 adopt/adapt/reject（那是 H4 主 agent 的事）"
    - "禁止联网检索、禁止替用户下载文献"
  optional_check:
    - "文献时效性（近 5 年优先）"
    - "文献权威性（期刊等级、引用量）"
    - "方法与本题的匹配度预判"
  focus: "文献需求清单 + 全文阅读 + 结构化摘要回传"
  output: "literature_sources.yaml（按 templates/literature_sources_template.yaml 格式）"
  common_pitfalls:
    - "文献数量不足（中文不够、总量不够）"
    - "在 H3 就提前确定模型路线（越权）"
    - "需求清单缺少回传字段或小问覆盖标注"
    - "仅基于摘要写总结，未阅读全文"
    - "method_summary 缺少参数、假设、适用条件"
    - "evidence_locators 模糊，无法回溯到具体页码/公式"
    - "把博客或搜索结果页当正式文献"
    - "越权做模型路线决策或方法迁移判断"

H4:
  name: "模型路线"
  review_scope: "核心（论文辅助深度审查）"
  must_check:
    - "主 agent（controller_only）是否必调 math-model-selector"
    - "是否产出 method_transfer_map.json、文献使用登记、模型路线"
    - "是否产出 model_blueprint.yaml、baseline、图表需求清单和 paper_narrative.yaml（叙事蓝图：每问 method/innovation/problem_solved + 全局 storyline）"
    - "每个小问是否都有 adopt 或 adapt 方法，以及一条数据/参数/测量先例/基准证据，均含 citation_key、定位、模型组件/数据字段和实际使用方式"
    - "图表需求清单是否只定义正文主张、图号占位、目标小问、所需结果字段和 argument_goal，不定义图型、视觉编码或版式（越权禁止）"
    - "防炫技-方法选择：每个子问题是否有 baseline（简单基线模型），禁止无 baseline 直接上复杂方法"
    - "防炫技-方法理由：是否说明为什么选这个方法、为什么不用更简单的方法，核心矛盾是什么、方法解决了什么、简单方法失败点是什么"
    - "防炫技-复杂度升级：使用复杂方法（启发式/强化学习/深度学习）时是否有升级记录，是否证明了简单方法失败或效果不足"
    - "防炫技-炫技信号：是否存在典型炫技信号（小规模优化用启发式、静态优化用强化学习、为适配算法强行构造不合理假设、方法名比逻辑链更重要）"
    - "用户是否批准模型路线（未批准不得进入 H5）"
  optional_check:
    - "防炫技-决策影响测试：复杂方法对最终决策的影响等级（0-3级），等级<2建议降级"
    - "模型复杂度与题目规模的匹配度"
  focus: "模型路线完整性 + 文献证据绑定 + 防炫技方法选择审查"
  common_pitfalls:
    - "未调用 math-model-selector"
    - "某个小问缺少 adopt/adapt 方法或证据"
    - "文献只有 citation_key 没有实际使用方式"
    - "图表需求清单提前定义了图型或视觉编码（越权）"
    - "无 baseline 直接上复杂方法（炫技）"
    - "方法选择理由不充分，核心矛盾未说明"
    - "为适配算法强行构造不合理假设（模型-假设不一致）"
    - "用户未批准就进入 H5"

H5:
  name: "解题"
  review_scope: "核心（论文辅助深度审查）"
  must_check:
    - "解题 agent（gpt-5.6-sol, high）是否执行，solver_instance_id 是否唯一且覆盖全部小问"
    - "dispatch_records 是否每次 spawn_agent 都写入，与任务卡、节点角色、模型、推理强度、实例ID、任务卡SHA-256一致"
    - "是否产出：全题模型契约、统一符号表、完整推导、代码、运行清单、跨问接口、结果与局部实验"
    - "是否产出 validation_contract.yaml（按 templates/validation_contract.yaml）"
    - "是否产出 model_summary_cards.yaml（每个小问一张最终求解模型卡，绑定最终可计算表达式、求解接口、来源公式和符号单位）"
    - "是否产出 result_interpretation_cards.yaml（每个核心结果的事实、意义、证据依据和适用范围）"
    - "是否回填 paper_narrative.yaml 的 key_result"
    - "B 题优化决策类（problem_profile.capabilities 含 optimization）是否产出 sensitivity_report.yaml 或 robustness_report.yaml（调用 pyomo/scripts/sensitivity_analysis.py 或 heuristic-algorithms/scripts/robustness_check.py），schema_version=1.0、含 status 和 results 列表"
    - "推导链完整：原始→中间→最终，每步有话语解释，禁止跳步黑箱，禁止'易知/显然/经过复杂推导'"
    - "符号完整性：每个公式符号是否在符号表出现，首次出现是否有定义（含义、单位/量纲、取值域、变量类型）"
    - "参数设定：每个参数是否有来源或推导，禁止凭空设定"
    - "代码注释质量-文件头：每个Python文件开头是否有1-3行说明这个文件做什么"
    - "代码注释质量-函数docstring：超过10行的函数是否有docstring，说明功能、参数、返回值"
    - "代码注释质量-复杂逻辑注释：嵌套>3层的复杂函数是否有行内注释，说明关键逻辑为什么这么做"
    - "代码注释质量-关键参数注释：初始温度、迭代次数、学习率、阈值等关键参数是否有注释说明含义和来源"
    - "代码注释质量-内容红线：注释中是否存在内部讨论话语、AI思考过程、元话语、负向回响、AI协作痕迹；注释必须是纯粹技术说明"
    - "数值合理性-inf/nan检测：求解结果中是否出现无穷大或非数，禁止异常结果进入结果登记"
    - "数值合理性-目标值量级：目标值是否 >1e15 或 <1e-15（非零），异常量级需要说明原因"
    - "数值合理性-结果文件完整性：JSON是否可解析、CSV列数是否一致、结果文件是否非空"
    - "数值合理性-物理范围：概率是否在[0,1]、长度是否>0等物理范围检查"
    - "数值合理性-约束违约：约束条件是否满足，违约量是否在可接受范围内"
    - "用户是否批准解题结果（未批准不得进入 H6）"
  optional_check:
    - "计算复杂度分析"
    - "数值稳定性分析"
    - "边界条件和极端情况"
    - "防炫技-baseline验证：baseline 结果是否真实可复现，复杂方法相比 baseline 是否有显著增量价值"
  focus: "解题完整性 + 推导链 + model_summary_cards/result_interpretation_cards + B题灵敏度报告 + 代码注释质量 + 数值合理性"
  common_pitfalls:
    - "solver_instance_id 不唯一，多个解题实例"
    - "dispatch_records 缺失或与任务卡不一致"
    - "推导跳步，关键步骤缺失，用'易知/显然'跳过"
    - "缺少 model_summary_cards.yaml 或 result_interpretation_cards.yaml"
    - "model_summary_cards 未绑定最终可计算表达式或求解接口"
    - "result_interpretation_cards 解释越界，超出冻结证据"
    - "paper_narrative.yaml 的 key_result 未回填"
    - "B 题缺少 sensitivity_report.yaml 或 robustness_report.yaml"
    - "符号未定义就使用"
    - "参数无来源，凭空设定"
    - "代码无注释：文件头缺失、函数无docstring、复杂逻辑无行内注释，像AI生成的"
    - "注释红线：注释包含元话语、负向回响、内部讨论、AI思考过程"
    - "数值异常：结果中出现inf/nan但未发现，异常结果进入结果登记"
    - "数值异常：目标值量级异常但未说明原因"
    - "数值异常：约束违约但未检查，最优解实际不可行"
    - "用户未批准就进入 H6"

H6:
  name: "验证"
  review_scope: "非核心（验证完整性检查）"
  must_check:
    - "验证 agent（gpt-5.6-sol, high）是否执行，agent_instance_id 是否不同于 H5"
    - "是否产出独立验证报告、h6_verification_scope.yaml、global_interface_check.yaml"
    - "是否核对 validation_contract.yaml（关键核对必查 + 深度抽查锚点，不重读 H5 全部推导/代码）"
    - "是否核验 model_summary_cards.yaml（每张卡核对符号、单位、公式、边界、代码接口和适用范围，写入 H6 当前实例签名）"
    - "是否核验 result_interpretation_cards.yaml（每张卡有真实证据、限定适用范围且解释不越界）"
    - "是否核验 paper_narrative.yaml 的 key_result 与冻结结果一致"
    - "共享变量、单位、数据版本、字段、时间尺度、参数、跨问约束、结论和来源是否一致"
    - "首次是否仅由 H5 结果冻结触发，后续是否仅由模型/数据/关键结果/结果解释卡变化触发定向复核"
    - "普通正文、排版、图表美化和附录格式变化是否误触发 H6（应该不触发）"
    - "用户是否批准验证结果（未批准不得进入 H7）"
  optional_check:
    - "验证抽样覆盖率"
    - "边界条件和极端情况验证"
  focus: "独立验证 + model_summary_cards/result_interpretation_cards 核验 + 全局接口一致性"
  common_pitfalls:
    - "H6 与 H5 使用同一实例（违反独立验证原则）"
    - "重读 H5 全部推导/代码（效率低，应该按 scope 定向核对）"
    - "model_summary_cards 未核验或未写入 H6 实例签名"
    - "result_interpretation_cards 解释越界，超出冻结证据"
    - "paper_narrative.yaml 的 key_result 与冻结结果不一致"
    - "跨问接口不一致（共享变量、单位、数据版本）"
    - "普通排版变化误触发 H6（应该不触发）"
    - "用户未批准就进入 H7"

H7:
  name: "图表"
  review_scope: "非核心（图表质量检查）"
  must_check:
    - "图表 agent（gpt-5.6-terra, medium）是否执行，是否分两阶段"
    - "阶段一：是否生成 visual_argument_plan.yaml（prepared_by=h7-figure-agent）"
    - "六类视觉义务审计：orientation、mechanism、model_structure、algorithm_process、result_evidence、validation_robustness，每类是否覆盖"
    - "每个有图槽位是否填写 figure_intent：读者问题、解释关系、必须出现/禁止出现内容、正文落位、图前/图后论证功能、唯一生成路由"
    - "阶段一计划是否提交用户审查（gate: H7_VISUAL_PLAN），用户是否批准（approval_log.yaml 中 gate: H7_VISUAL_PLAN 且覆盖当前计划 SHA-256）"
    - "阶段二：是否按批准计划生成图表，数据结果图走 SciPilot→ModelViz→SciPilot，流程图走 tech-route-maker，示意图走 tikz-scientific-figures"
    - "每张图是否有 SVG + PNG，insertion_format=svg，登记 figure_registry"
    - "每张图是否绑定 visual_slot_ids（已批准槽位）、claim、reader_takeaway"
    - "图表路由登记：数据结果图 generator=modelviz, semantic_qa=scipilot-figure-skill, formats=[svg,png], insertion_format=svg"
    - "禁止饼图、双Y轴、彩虹色图、无单位坐标轴、分类点连成无意义折线"
    - "图表确认前是否冻结论文素材（应该不冻结）"
    - "页面布局是否由 mathmodel-latex-skill 执行，不由 SciPilot 或 ModelViz 改变图表语义"
    - "layout_mode 是否只使用 single、side_by_side、wrap_short、tall_constrained 四种受控入口"
    - "用户是否肉眼批准图表（未批准不得进入 H8）"
  optional_check:
    - "图表美观度和信息密度"
    - "表多图少时是否触发视觉平衡审查"
  focus: "视觉论证计划 + 六类视觉义务 + 图表路由登记 + 布局受控入口"
  common_pitfalls:
    - "跳过阶段一直接生成图表（违反两阶段流程）"
    - "视觉论证计划未经用户批准就进入阶段二"
    - "六类视觉义务有遗漏，硬性义务用'文字已足够'规避"
    - "figure_intent 缺少读者问题或论证功能"
    - "图表缺少 SVG 或 PNG，或 insertion_format 不是 svg"
    - "figure_registry 未绑定 visual_slot_ids"
    - "计划外图表（未在 visual_argument_plan 中登记）"
    - "图表路由登记错误（generator、semantic_qa、formats 不匹配）"
    - "用 [H] 强制位置、连续浮动体、手工 \\vspace"
    - "layout_mode 使用了非受控入口"
    - "图表确认前就冻结论文素材"
    - "用户未肉眼批准就进入 H8"

H8:
  name: "论文（分 H8A/H8B/H8C 三子阶段）"
  review_scope: "核心（论文辅助深度审查）"
  sub_stages:
    H8A:
      name: "论证蓝图+作者简报"
      must_check:
        - "素材准入两文件：paper_material_readiness.yaml（schema_version 2.0，含 evidence_matrix）和 paper_claim_coverage.yaml 是否齐全且 PASS"
        - "academic-writing 是否生成 paper_argument_blueprint.yaml（读者问题—论证—证据蓝图）"
        - "academic-writing 是否生成 paper_author_brief.yaml（作者简报，固定全文主张、读者问题、章节目的、问题引入段、双小节结构、论证、证据和图表职责）"
        - "academic-writing 是否生成 abstract_argument_card.yaml（摘要论证卡，固定读者契约、全文主张、统一建模主线、逐问方法—结果—意义、验证结论、总评和关键词）"
        - "paper_narrative.global.paper_spine 是否规定唯一章节顺序，core 章节承载建模与求解，support 章节服务于核心论证"
        - "每章是否登记 chapter_role、reads_from、feeds_to、new_claims_allowed 和 handoff_question"
        - "主 agent 是否生成写作计划，用户是否批准写作计划（未批准不得进入 H8B）"
      common_pitfalls:
        - "素材准入未 PASS 就开始 H8A"
        - "缺少 paper_argument_blueprint.yaml 或 paper_author_brief.yaml"
        - "缺少 abstract_argument_card.yaml"
        - "paper_spine 未规定唯一章节顺序，core/support 角色未区分"
        - "章节卡缺少 chapter_role 或 handoff_question"
        - "用户未批准写作计划就进入 H8B"

    H8B:
      name: "逐章写作"
      must_check:
        - "论文 agent（gpt-5.6-sol, high）是否按 chapter_writing_card.yaml 逐章写作"
        - "每次是否只接收一个 chapter_writing_card.yaml、一个哈希绑定的 paper_continuity_context.yaml、已核验的 model_summary_cards.yaml、摘要论证卡和对应冻结材料"
        - "每张章节卡是否填写 abstract_contribution（方法、结果、意义和证据引用）"
        - "是否遵循 h8_writer_first_protocol.md 与 model_summary_protocol.md：先回答读者问题、组织论证和自然段，再做硬性检查"
        - "写作结构：先写不编号的问题引入与建模思路段，再设'模型建立'和'模型求解与结果分析'两个编号小节，模型建立小节末尾呈现最终求解模型框"
        - "一级标题是否使用中文序号，'模型假设'和'符号说明'是否分设为两个全局一级章节"
        - "是否只组织已冻结证据，不得新增模型结论、数字、引用用途或图表解释"
        - "H8B 是否写了最终摘要（应该不写，摘要只能在 H8C 最后写作）"
        - "元话语：正文主体是否残留建模者元注释（过程描述、工具说明、边界提醒）"
        - "负向回声：是否残留被否决方案、旧版本、失败尝试、修改过程、AI 协作痕迹"
        - "符号一致性：论文中的符号是否与符号表一致，前后定义是否矛盾"
        - "公式检查：公式编号是否连续，交叉引用是否正确，公式是否可编译"
        - "引用检查：正文引用位置与文献作用是否对应，只统计正文实际引用的唯一 BibTeX 键"
        - "页数规则（国赛2026）：摘要不计入正文，正文最多30页，总页数最多51页，总PDF推荐35-51页，PDF≤20MB"
        - "模型章节比例：模型建立与求解章节占正文45%-55%，低于42%警告"
        - "占位符检查：TODO、占位、待补充、xxx、Lorem 必须清除"
        - "叙事质量-角色定位：论文是否以论文作者视角写作，而非建模者视角；是否存在建模日志式表述"
        - "叙事质量-公式密度按章节区分：建模求解章节是否全链路推导，非建模章节（问题分析/结论/模型评价）是否存在公式堆砌"
        - "叙事质量-结果解释：每个核心数值后面是否有意义解读，是否存在只报数字不解释的情况"
        - "叙事质量-算法细节位置：伪代码、参数表、调优过程、收敛曲线是否放附录，正文是否存在算法实现细节堆砌"
        - "叙事质量-推导衔接：推导前后是否有语言衔接，是否存在连续3个以上公式中间无文字"
        - "LaTeX注释质量-章节分隔：每个\\section前是否有分隔标记，格式：% ===== 章节标题 ====="
        - "LaTeX注释质量-关键环境：关键图表/公式环境前是否有注释说明用途"
        - "LaTeX注释质量-附录分节：附录每个分节前是否有标记，说明代码/数据归属哪个小问"
        - "LaTeX注释质量-内容红线：LaTeX注释中是否存在内部讨论话语、AI思考过程、元话语、负向回响、AI协作痕迹"
        - "B题摘要模板（H8B不写摘要，但检查摘要论证卡是否准备好）"
        - "B题建模求解模板-骨架结构：每个建模求解章节是否遵循模板库的骨架结构（建模思路→数据处理→模型建立→模型求解→结果分析→模型检验），六小节齐全"
        - "B题建模求解模板-必选项清单：是否包含必选项（问题概括句、建模思路、变量定义、目标函数、约束条件、求解算法、结果表、结果解读、算例验证）"
        - "B题建模求解模板-反机械硬约束：每个公式前是否有文字引导（为什么要建立这个模型），每个公式后是否有文字解释（含义、变量、成立条件）"
        - "B题建模求解模板-连续公式限制：是否存在连续3个以上公式中间无文字衔接，超过必须插入文字解释"
        - "B题建模求解模板-2级标题具体：2级标题是否包含具体内容，不能只用'模型的建立''模型的求解'等通用词"
        - "B题建模求解模板-结果解读：结果分析是否有意义解读，不能只罗列数值，每个核心数值后面必须跟一句意义解读"
        - "防御性写作-工作汇报式叙述：是否存在'我们先做了A又试了B最后选了C'的过程展开"
        - "防御性写作-自我削弱表达：是否使用'遗憾的是''仅''仍明显落后''效果有限''存在严重不足''不得不''只能''勉强'等表达"
        - "防御性写作-优势明说：每个核心结果后面是否有主动解释（意味着什么、为什么重要、解决了什么问题）"
        - "防御性写作-结果论证职责：每个结果/图表是否承担明确论证职责，是否存在无法强化主线、容易分散注意力的结果堆砌"
        - "防御性写作-结论自我否定：结论是否只讲'解决了什么、证明了什么、为什么重要'，是否在最后一段突然加入新的自我否定或扩大局限性"
        - "防御性写作-局部上升整体：是否把局部不占优的结果提炼成结论、上升为对整体方法的否定"
        - "防御性写作-攻击面扩大：是否提出了本来没人要求回答的问题、是否使用了比证据更宽泛的负面判断"
        - "AI工具使用声明：正文在参考文献前是否放置声明，支撑材料是否提供 AI工具使用详情.pdf"
        - "附录顺序（国赛A-E）：A支撑材料清单、B核心代码、C推导/演算、D补充表格/验证、E AI工具使用说明"
      common_pitfalls:
        - "H8B 写了摘要（应该 H8C 最后写）"
        - "章节卡缺少 abstract_contribution"
        - "未遵循 h8_writer_first_protocol.md，先做检查再写论证（顺序反了）"
        - "写作结构错误：缺少问题引入段，或模型建立小节末尾没有最终求解模型框"
        - "一级标题未用中文序号，或'模型假设'和'符号说明'合并了"
        - "新增了未冻结的模型结论或数字"
        - "元话语残留：'本文将'、'我们采用'、'该表只反映'等"
        - "负向回声残留：'v1'、'尝试了'、'最终选择'、'agent'等"
        - "建模手写论文：非建模章节公式堆砌，该用语言的地方放公式"
        - "建模手写论文：结果数值无解释，只报数字不说意义"
        - "建模手写论文：算法实现细节放正文，应该放附录"
        - "建模手写论文：推导前后无语言衔接，连续公式无文字"
        - "LaTeX无注释：章节无分隔标记、关键图表无注释、附录无分节标记，像AI生成的"
        - "LaTeX注释红线：注释包含元话语、负向回响、内部讨论"
        - "B题建模求解模板：六小节不齐全，缺少模型检验或结果分析"
        - "B题建模求解模板：公式前无文字引导，直接扔公式；公式后无解释"
        - "B题建模求解模板：连续3个以上公式中间无文字衔接，像公式堆砌"
        - "B题建模求解模板：2级标题太通用（模型的建立、模型的求解），没有包含具体内容"
        - "B题建模求解模板：结果只罗列数值没有解读"
        - "防御性写作：工作汇报式叙述，按'我们先做了A又试了B最后选了C'的过程展开"
        - "防御性写作：自我削弱表达，'遗憾的是''仅''效果有限''存在不足'等"
        - "防御性写作：优势没有明说，只报数字不解释意味着什么"
        - "防御性写作：结果堆砌，每个结果没有明确论证职责"
        - "防御性写作：结论突然自我否定，最后一段加入新的局限性"
        - "AI工具使用声明缺失或位置错误"
        - "附录顺序不符合 A-E 规范"

    H8C:
      name: "通读编辑+摘要最后写作"
      must_check:
        - "academic-writing 是否先通读完整论文、检查读者路径、章节递进和主线承接"
        - "是否依据摘要论证卡和各章摘要贡献最后写摘要（摘要只能在 H8C 最后写作）"
        - "是否运行 check_abstract_contract.py --strict，登记 abstract_contract_report"
        - "摘要检查：是否覆盖问题、方法、结果、结论，字数是否符合要求（550-800字）"
        - "B题摘要模板-引言段结构：摘要引言段是否遵循两句结构（问题要求+建模思路），不超过2句"
        - "B题摘要模板-方法结果绑定：每问是否同时出现方法名和量化结果，不能只写方法不写结果，也不能只写结果不写方法"
        - "B题摘要模板-验证灵敏度：摘要是否包含模型检验或灵敏度分析的具体结论，不能只写'模型具有鲁棒性'"
        - "B题摘要模板-关键词精准：关键词是否覆盖核心方法和研究对象，不写'数学建模''优化''分析'等无区分度的词，数量3-5个"
        - "材料不足时是否返回 evidence_gap 并回到 H5/H6/H7 补足，不得用重复表述、泛泛背景、空洞评价、文献堆砌填充篇幅"
        - "表达问题是否形成局部正文补丁（材料不足才回流，表达问题才补丁）"
        - "academic-writing 的正文补丁是否经 mathmodel_patch_guard.py 保护器 PASS 后才合并"
        - "用户是否批准 H8C 结果（未批准不得进入 H9）"
      common_pitfalls:
        - "H8C 未先通读全文就直接编辑"
        - "摘要在 H8B 就写了（应该 H8C 最后写）"
        - "check_abstract_contract.py --strict 未运行或未通过"
        - "B题摘要：引言段超过2句，或只有背景没有建模思路"
        - "B题摘要：某问只有方法名没有量化结果，或只有结果没有方法名"
        - "B题摘要：缺少模型检验或灵敏度分析的具体结论，只写'模型具有鲁棒性'"
        - "B题摘要：关键词太泛（数学建模、优化、分析），或数量超过5个"
        - "材料不足时用重复表述或泛泛背景填充篇幅（应该回流补证据）"
        - "mathmodel_patch_guard.py 保护器未 PASS 就合并补丁"
        - "用户未批准就进入 H9"

  focus: "H8A 蓝图+简报批准 → H8B 逐章写作质量 → H8C 通读编辑+摘要最后写作"
  common_pitfalls:
    - "素材准入未 PASS 就开始写作"
    - "H8A 缺少 paper_argument_blueprint.yaml 或 paper_author_brief.yaml"
    - "H8B 写了摘要（应该 H8C 最后写）"
    - "H8B 未遵循 h8_writer_first_protocol.md，先做检查再写论证"
    - "H8C 未运行 check_abstract_contract.py --strict"
    - "建模手写论文：非建模章节公式堆砌，结果无解释，算法细节放正文"
    - "元话语/负向回声残留"
    - "B题摘要和建模模板要求不满足"
    - "防御性写作问题"
    - "LaTeX无注释，像AI生成的"

H9:
  name: "交付审计"
  review_scope: "核心（论文辅助深度审查）"
  must_check:
    - "主 agent（controller_only）是否执行，是否必调 bzd-review-paper 和 mathmodel-latex-skill"
    - "交付前是否运行 python scripts/delivery_all.py <项目根> --strict，全部 PASS 后才交付"
    - "PDF 编译：无错误、无未解析引用、无超宽盒子、无孤页、无空白页"
    - "PDF 文本层：文字可复制、无乱码、公式渲染正确"
    - "PDF 文件大小：不超过 20 MB"
    - "页数规则（国赛2026）：摘要不计入正文，正文最多30页（含AI声明和参考文献），总页数最多51页，推荐35-51页"
    - "正式目录：文件结构是否规范，有无多余文件"
    - "支撑材料：与附录清单一一对应，ZIP/RAR 不超过 20 MB，完整可运行"
    - "源码：完整可运行，路径使用相对路径，无硬编码绝对路径"
    - "负向回声：最终成品中是否残留内部日志、过程轨迹、未定稿内容"
    - "匿名检查：是否泄露团队信息、学校名称、个人姓名（如竞赛要求匿名）"
    - "AI工具使用声明：正文在参考文献前放置声明，支撑材料提供 AI工具使用详情.pdf，内容真实"
    - "附录顺序（国赛A-E）：A支撑材料清单、B核心代码、C推导/演算、D补充表格/验证、E AI工具使用说明"
    - "输入哈希重算：input_manifest.yaml 中每个文件的 SHA-256 是否与实际文件一致，总哈希按路径排序的 path:sha256 列表计算"
    - "哈希校验：最终版本与已批准版本哈希是否一致"
    - "审计报告：批准记录、修改日志是否完整"
    - "禁止修改任何被审计文件（严格只读）"
    - "用户是否最终批准（未批准不得交付）"
  optional_check:
    - "字体嵌入是否完整"
    - "打印预览效果"
  focus: "delivery_all.py --strict 全部 PASS + bzd-review-paper + 编译检查 + 交付合规 + 输入哈希重算"
  common_pitfalls:
    - "delivery_all.py --strict 有 FAIL 或 WARN 就宣称交付完成"
    - "未调 bzd-review-paper"
    - "编译通过但有未解析引用（显示??）"
    - "支撑材料压缩包内容与清单不符"
    - "附录代码片段与完整源码不一致"
    - "最终版本与已批准版本哈希不一致"
    - "PDF 中有空白页或孤页"
    - "泄露团队信息（违反匿名要求）"
    - "负向回声残留到最终成品"
    - "源码中有硬编码绝对路径，无法在其他机器运行"
    - "页数计算错误（把摘要计入正文）"
    - "AI工具使用声明缺失或内容不真实"
    - "附录顺序不符合 A-E 规范"
    - "input_manifest.yaml 哈希与实际文件不一致"
    - "用户未最终批准就交付"

# 各节点检查重点差异表
# 审查时必须先读取本文件，明确当前节点的必查项和选查项

G0:
  name: "题目理解与条件账本"
  must_check:
    - "子问题拆分是否正确，是否遗漏小问"
    - "数据审计：题设参数是否完整提取，单位是否统一"
    - "假设边界：哪些是题设给定，哪些是建模假设"
    - "条件账本：每个小问的输入、输出、约束是否清晰"
  optional_check:
    - "题目背景理解是否准确"
    - "专业术语使用是否正确"
  focus: "A符号完整性（题设参数）、D模型证据（条件账本）"
  common_pitfalls:
    - "把题设规则误写为新增假设"
    - "遗漏题设中的隐含条件"
    - "参数单位不统一"

G1:
  name: "文献调研与方法迁移"
  must_check:
    - "文献真实性：每篇是否有DOI或官方链接"
    - "文献数量：总数硬范围 6-11 篇，推荐 8-10 篇；中文每小问至少 1 篇；英文至少 1 篇"
    - "只统计正文实际引用的唯一 BibTeX 键；.bib 中未被正文调用的条目不算数（unused_bib_is_failure）"
    - "引用作用登记：每个被引用键必须在 citation_map.json 登记 role（method_basis/parameter_source/measurement_precedent/selection_criterion/solver/comparison_boundary）"
    - "引用位置：引用紧跟支持的事实，置于句末标点前；禁止多个无关编号堆在段末"
    - "禁止竞赛题面、附件说明、竞赛通知作为学术参考文献写入 .bib"
    - "每篇文献字段完整：title, authors, venue, year, doi_or_url, abstract, full_text_summary, method_summary, data_summary, limitations, evidence_locators, candidate_questions"
    - "方法迁移边界：每篇文献的adopt/adapt/reject决策是否有技术理由"
    - "每个小问至少绑定一条 adopt/adapt 方法证据和一条数据/参数/基准证据"
    - "禁止博客、搜索结果页作为正式文献"
  optional_check:
    - "文献时效性（近5年优先）"
    - "文献权威性（期刊等级）"
  focus: "B元话语（文献综述部分）、D模型证据（方法迁移）"
  common_pitfalls:
    - "把无关文献强行套用"
    - "文献方法迁移不说明改造点"
    - "引用位置与文献作用不匹配"
    - "文献数量不足（中文不够、总量不够）"
    - "只有文献综述，未进入模型/代码/参数/数据的实际使用"

G2:
  name: "总体架构与内容预算"
  must_check:
    - "每问模型路线是否清晰，baseline是否明确"
    - "内容预算：每个小问的关键结论、推导链、代码结果、图表计划是否齐全"
    - "主张-证据映射：每个结论是否有对应的证据来源"
    - "初版图表计划：是否有足够的主视觉证据"
    - "禁止只有路线没有实质单元的空架构"
  optional_check:
    - "模型创新性边界是否清晰"
    - "各问之间的接口是否明确"
  focus: "D模型证据（内容预算闭合）、B元话语（架构描述）"
  common_pitfalls:
    - "内容预算只有标题没有实质内容"
    - "图表计划只有数量没有论证价值"
    - "主张没有证据支撑"

G3:
  name: "条件式小问建模（高风险题触发）"
  must_check:
    - "仅复杂、混合、高风险或baseline不稳的小问触发本节点"
    - "推导链：原始关系式→中间推导→最终模型是否完整"
    - "算法步骤：是否清晰可复现"
    - "参数设定：每个参数是否有来源或推导"
    - "代码方案：是否与模型对应"
    - "状态闭合：循环策略是否能以概率1完成交付"
  optional_check:
    - "计算复杂度分析"
    - "数值稳定性分析"
  focus: "A符号完整性（模型变量）、D模型证据（推导链闭合）"
  common_pitfalls:
    - "推导跳步，关键步骤缺失"
    - "参数无来源，凭空设定"
    - "状态不闭合，存在无限循环"
    - "用简化支配规则代替完整状态价值比较"

G4:
  name: "结果与图表"
  must_check:
    - "真实结果：每个数字是否能追溯到代码输出或数据文件"
    - "验证：是否有独立复核、交叉验证、敏感性分析"
    - "主图候选：每个核心小问是否有至少一项主视觉证据"
    - "图表绑定：每张图是否绑定明确结论、真实数据源、生成脚本、正文解读"
    - "图表路由登记：数据结果图 generator=modelviz, semantic_qa=scipilot-figure-skill, formats=[svg,png], insertion_format=svg"
    - "图表决策卡：数据图必须先有 SciPilot 决策卡，再调用 ModelViz"
    - "禁止饼图、双Y轴、彩虹色图、无单位坐标轴、分类点连成无意义折线"
    - "图表平衡：表多图少时是否触发VISUAL_BALANCE_REVIEW"
    - "禁止只有表格没有趋势图的空间/优化/预测题"
  optional_check:
    - "图表美观度"
    - "图表编号连续性"
  focus: "D模型证据（结果可复现+图表登记）、C负向回声（中间结果残留）"
  common_pitfalls:
    - "图表无正文引用（孤儿图表）"
    - "图表数据与正文数字不一致"
    - "只有精确数值表，没有趋势/过程/边界图"
    - "图表标题用内部简称（如Q1、Q2）"
    - "缺少图表决策卡或登记信息"
    - "使用禁止图型（饼图、双Y轴、彩虹色）"

G5:
  name: "论文与附录蓝图"
  must_check:
    - "章节素材：每个章节是否有足够的实质内容"
    - "图表位置：每张图表是否放在正确的章节"
    - "附录覆盖矩阵：每个有独立算法的小问是否有核心代码片段"
    - "附录完整性：关键推导、补充结果、验证材料是否齐全"
    - "附录顺序（国赛A-E）：A支撑材料清单、B核心代码、C推导/演算、D补充表格/验证、E AI工具使用说明"
    - "AI工具使用声明：正文在参考文献前放置声明，支撑材料提供 AI工具使用详情.pdf"
    - "禁止少量文字或单表独占一节附录"
    - "附录只放核心代码片段，完整源码进入支撑材料压缩包"
  optional_check:
    - "章节逻辑顺序"
    - "附录编号规范性"
  focus: "B元话语（章节过渡）、C负向回声（附录残留）"
  common_pitfalls:
    - "附录代码片段断裂，无法独立理解"
    - "附录只有代码没有说明"
    - "支撑材料清单与实际压缩包内容不对应"
    - "附录图表无编号或编号混乱"
    - "AI工具使用声明缺失或位置错误"

G6:
  name: "最终交付"
  must_check:
    - "PDF编译：无错误、无未解析引用、无超宽、无孤页、无空白页"
    - "PDF文本层：文字可复制、无乱码、公式渲染正确"
    - "PDF文件大小：不超过 20 MB"
    - "页数规则（国赛2026）：摘要不计入正文页数，正文从正文主体起计（含AI工具声明和参考文献）最多 30 页；提交论文总页数最多 51 页"
    - "目录：电子版不设目录（除非官方模板要求）"
    - "源码：完整可运行，路径使用相对路径，无硬编码绝对路径"
    - "支撑材料：与附录清单一一对应，ZIP/RAR 不超过 20 MB"
    - "AI工具使用声明：正文在参考文献前放置声明，支撑材料提供 AI工具使用详情.pdf，内容真实覆盖实际使用范围"
    - "匿名检查：不泄露团队信息、学校名称、个人姓名（如竞赛要求匿名）"
    - "审计报告：批准记录、哈希校验、修改日志是否完整"
    - "交叉引用：所有图、表、公式、文献引用正确解析"
    - "文献引用：只统计正文实际引用的唯一 BibTeX 键，.bib 未被正文调用不算数；引用必须有作用说明"
    - "模型章节比例：模型建立与求解章节占正文45%-55%，低于42%警告"
    - "占位符检查：TODO、占位、待补充、xxx、Lorem 必须清除"
    - "标题检查：禁止'2025'、'全国大学生数学建模竞赛'、'高教社杯'出现在标题"
    - "禁止身份词：姓名、学校、学院、学号、指导教师、手机号、邮箱不得出现在正文（匿名要求）"
  optional_check:
    - "字体嵌入是否完整"
    - "打印预览效果"
  focus: "全部四项（最终全面检查）+ 编译检查 + 交付合规"
  common_pitfalls:
    - "编译通过但有未解析引用（显示??）"
    - "支撑材料压缩包内容与清单不符"
    - "附录代码片段与完整源码不一致"
    - "最终版本与已批准版本哈希不一致"
    - "页数计算错误（把摘要计入正文）"
    - "AI工具使用声明缺失或内容不真实"
    - "PDF 中有空白页或孤页"

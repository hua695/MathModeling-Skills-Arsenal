schema_version: "1.0"
description: "contest-orchestrator scripts classification; patterns are relative to this skill root."
runtime_policy:
  canonical_entrypoint: "scripts/delivery_all.py"
  health_entrypoint: "scripts/skill_health_check.py"
  project_artifacts: ["<project-root>/competition_replay/", "<project-root>/simulations/", "<project-root>/dataset/", "<project-root>/05_输出与交付/"]
  history_artifacts: ["scripts/archive/", "SKILL_v*_backup.md", "SKILL_v*_full.md", "CHANGELOG_*.md"]
  allow_path_literals: ["scripts/check_skill_consistency.py", "scripts/skill_health_check.py", "scripts/install_skill.py"]
allow_overlaps:
  - "scripts/check_appendix_contract.py"
  - "scripts/check_code_appendix.py"
  - "scripts/check_heading_levels.py"
  - "scripts/check_skill_consistency.py"
  - "scripts/import_experience.py"
  - "scripts/import_public_experience.py"
  - "scripts/psr_measure.py"
  - "scripts/init_model_contract.py"
  - "scripts/check_run_manifest.py"
  - "scripts/check_stale_evidence.py"
  - "scripts/check_h5_result_traceability.py"
  - "scripts/check_content_budget.py"
  - "scripts/check_visual_evidence.py"
categories:
  canonical_entrypoints:
    - "scripts/delivery_all.py"
    - "scripts/scope_router.py"
    - "scripts/mode_router.py"
    - "scripts/audit_project.py"
    - "scripts/skill_health_check.py"
    - "scripts/check_skill_consistency.py"
  contract_gates:
    - "scripts/check_*.py"
    - "scripts/delivery_gate.py"
    - "scripts/consistency_check.py"
    - "scripts/latex_warning_check.py"
  compilation_and_delivery:
    - "scripts/compile_*.py"
    - "scripts/delivery_manifest.py"
    - "scripts/figure_registry.py"
    - "scripts/verify_doi.py"
    - "scripts/release_audit.py"
  planning_tools:
    - "scripts/appendix_planner.py"
    - "scripts/collab_gate.py"
    - "scripts/route_problem_profile.py"
    - "scripts/check_content_budget.py"
    - "scripts/validation_router.py"
    - "scripts/init_b_project.py"
  replay_and_tests:
    - "scripts/benchmark_*.py"
    - "scripts/*test.py"
    - "scripts/replay_profiles.py"
    - "scripts/semantic_replay.py"
    - "scripts/regression_guard.py"
    - "scripts/coverage_matrix.py"
  paper_and_visual_tools:
    - "scripts/docx_*.py"
    - "scripts/visual_critic.py"
    - "scripts/paper_check.py"
    - "scripts/check_heading_levels.py"
    - "scripts/make_reference_doc.py"
    - "scripts/extract_paper_texts.py"
    - "scripts/extract_pdf_tables.py"
    - "scripts/psr_measure.py"
  memory_and_import:
    - "scripts/*experience*.py"
    - "scripts/*memory*.py"
    - "scripts/extract_wr.py"
    - "scripts/index_memory.py"
    - "scripts/retrieval_audit.py"
    - "scripts/extract_and_import_batch.py"
  platform_and_maintenance:
    - "scripts/add_meta_fd.py"
    - "scripts/dedup_wbp9.py"
    - "scripts/retag_real_replay.py"
    - "scripts/retag_wb_fd.py"
    - "scripts/rm_bad_fd522.py"
    - "scripts/import_*.py"
    - "scripts/convert_wb_to_jsonl.py"
    - "scripts/public_sync.py"
    - "scripts/install_skill.py"
    - "scripts/sync_skill*"
    - "scripts/ensure_writable.ps1"
  legacy_compatibility:
    - "scripts/check_appendix_contract.py"
    - "scripts/check_code_appendix.py"
    - "scripts/ab_compare_*.py"
    - "scripts/strip_bzd_promo.py"
    - "scripts/psr_measure.py"
  numeric_and_freeze:
    - "scripts/freeze_numbers.py"
  evidence_integrity:
    - "scripts/build_evidence_index.py"
    - "scripts/capture_run.py"
    - "scripts/check_run_manifest.py"
    - "scripts/check_h5_result_traceability.py"
    - "scripts/check_stale_evidence.py"
    - "scripts/audit_numeric_sources.py"
    - "scripts/compute_readiness.py"
  migration_tools:
    - "scripts/migrate_figure_registry.py"
    - "scripts/init_model_contract.py"
    - "scripts/archive_user_artifacts.py"
  archive_not_runtime:
    - "scripts/archive/**"
    - "scripts/public_overrides/**"

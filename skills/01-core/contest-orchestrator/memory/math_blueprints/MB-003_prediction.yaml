# MB-003 预测/时序 母蓝图（Math Reasoning Scaffold · 国赛版）
# 用途：solving 阶段按 problem_type=预测/时序 强制注入，先给"模型数学结构+误差理论"再写代码。
# 原则：预测题的分水岭是"模型选择有依据+误差有统计意义"还是"堆 LSTM/ARIMA 名字给个 RMSE"。

blueprint_id: MB-003
problem_type: 预测/时序
competition_variant: 国赛版
summary: 这类题的核心数学化矛盾是"把观测序列转成可估计的随机/函数模型，并给出误差与不确定性度量"；防止只写"采用 LSTM 预测"式模型调用说明书（see WR-005 堆参数无数字陷阱）。

abstraction_map:
  objects:
    - "观测时刻 → 时间索引 t（等间隔/不等间隔）"
    - "观测对象（个体/站点/序列）→ 序列下标 i"
    - "待预测量 → 响应变量 y_t（标量/向量）"
  relationships:
    - "时间依赖（滞后/趋势/周期）→ 滞后项、差分、周期分量"
    - "多变量关系 → 协变量矩阵 X_t"
    - "外部扰动 → 干预项/外生变量"
  decision:
    - "模型族选择 → 由数据特征判定（平稳性/非线性/长记忆）"
    - "滞后阶数/窗口 → 由 ACF/PACF、信息准则（AIC/BIC）或交叉验证选定"
    - "参数估计 → 最小二乘/极大似然/梯度训练"

symbols:
  - {sym: "y_t", meaning: "响应变量（t 时刻观测）", unit: "依题意"}
  - {sym: "X_t", meaning: "协变量/外生变量向量", unit: "依题意"}
  - {sym: "ε_t", meaning: "随机扰动项（假设：零均值、同方差或 GARCH 结构）", unit: ""}
  - {sym: "p, q", meaning: "AR 阶数 / MA 阶数", unit: ""}
  - {sym: "h", meaning: "预测步长/窗口", unit: ""}

steps:
  - step: 1
    name: 数据侧写
    template: "先做探索性分析：趋势/季节/周期/异常/平稳性检验（ADF 等）——每个建模选择都要溯源到数据（see WR-010/011）"
    required: true
  - step: 2
    name: 模型结构
    template: "写出模型完整数学结构（如 ARIMA(p,d,q) 方程 y_t 的显式表达、LSTM 的门控方程或状态空间形式），说明结构选择依据"
    required: true
  - step: 3
    name: 估计方法
    template: "参数估计方法（最小二乘/MLE/梯度下降），给出估计的收敛或统计性质（一致/无偏/渐近正态）"
    required: true
  - step: 4
    name: 误差与验证
    template: "训练/测试划分（时序必须按时间切，禁止随机切——防泄漏）；误差指标（RMSE/MAE/MAPE）与基线对比（ARIMA/朴素/线性），给出提升百分比（see WR-005）"
    required: true
  - step: 5
    name: 不确定性
    template: "预测区间/置信区间（若可能）；说明误差分布假设与检验（残差白噪声检验）"
    required: false
  - step: 6
    name: 理论性质
    template: "模型可辨识性、过拟合风险（参数数 vs 样本量）、复杂度（训练/推理 O(·)）；退化情形（无趋势/平稳）应退化为简化模型"
    required: false
    alternative: [可辨识性, 过拟合讨论, 复杂度分析]

selection_logic:
  - if: {data: 平稳, relationship: 线性}
    choose: ARIMA/ARIMAX（Box-Jenkins 流程：识别-估计-诊断）
    because: 线性+平稳有完整统计理论（ACF/PACF 定阶、MLE 估计、残差白噪声检验）
  - if: {data: 非平稳}
    choose: 差分平稳化后 ARIMA / 确定性趋势+ARMA 残差
    because: 直接回归非平稳序列会伪回归（see WR-1968 先散点图判断线性）
  - if: {relationship: 强非线性, data: 大}
    choose: 树模型（GBDT/XGBoost）/深度学习（LSTM/Transformer）——但必须给与统计基线的量化对比
    because: 非线性拟合强，但可解释性弱，须证明非线性增益（ablation，see WR-440 聚类前后对比）
  - if: {data: 小样本, relationship: 线性}
    choose: 线性回归/岭回归/卡尔曼滤波
    because: 小样本下复杂模型过拟合，线性模型参数少、可解释
  - if: {structure: 多步递推, requirement: 多步预测}
    choose: 递归预测/直接预测/seq2seq，说明误差累积处理
    because: 多步预测有误差累积问题，需明确策略（see WR-343 先给分布再建模）

propositions:
  - name: ARIMA 模型结构
    template: "φ(B)(1−B)^d y_t = θ(B) ε_t，其中 B 为滞后算子；平稳性要求 φ(B) 根在单位圆外。"
    provenance: "专家模板（建库时手工编写）"
    see: [WR-1968]
  - name: 伪回归风险
    template: "两个独立非平稳序列回归会得显著但虚假的关系；故先差分/协整检验再建模。"
    provenance: "专家模板（建库时手工编写）"
    see: [WR-1968]
  - name: 时序交叉验证
    template: "训练集 t≤T，测试集 t>T（滚动/扩展窗口）；随机 K 折对时序无效——会引入未来信息泄漏。"
    provenance: "专家模板（建库时手工编写）"
    see: [WR-11748 数据特征分析先行]
  - name: 基线对比必要性
    template: "复杂模型必须与朴素/统计基线（随机游走/ARIMA/线性）对比误差，证明非线性或深度学习增益非数据巧合。"
    provenance: "专家模板（建库时手工编写）"
    see: [WR-005, WR-440]

  - name: 分段多项式拟合判据
    template: "若响应变量对自变量的变化率在某阈值处发生符号反转，则全域单一多项式刻画必有较大偏差；应先在散点上定位拐点划分区间，在子区间上分别用低次多项式最小二乘拟合，并以各段拟合优度与备选次数（如三次对二次）的对比论证分段与次数选择的合理性。"
    provenance: "2023国赛E|基于时间序列分析预测的黄河水沙监测模型|E032"

  - name: 缺失值邻近加权替补
    template: "对等间隔时序中的缺失点，取前后最近非空观测，按与缺失点的时点间隔倒数设置权数加权填补；若仅向后探测到最近非空值，则退化为前后观测的算术平均，并保证序列长度一致性（如剔除闰日）。"
    provenance: "2023国赛E|基于时间序列分析预测的黄河水沙监测模型|E032"

  - name: 累积距平-秩检验双重突变定位
    template: "对时序序列先计算相对均值的累积距平，以曲线极值给出突变候选区间；再用基于秩序列的统计量构造正反序列统计曲线，取其在置信临界线内交点的时刻为突变点；仅当两种独立证据一致时确认突变。"
    provenance: "2023国赛E|基于时间序列分析预测的黄河水沙监测模型|E032"

  - name: 断面离散积分与流速面积加权平均
    template: "将不规则水道断面沿横向以测深垂线为界离散为梯形单元（首尾三角形视为特例）求和得断面总面积；平均流速取各测速点以相邻测点中点划分的作用面积对测点流速的加权平均，避免单点流速代替断面流速。"
    provenance: "2023国赛E|基于时间序列分析预测的黄河水沙监测模型|E032"

  - name: 双对数回归的弹性解释
    template: "对取值恒正且呈正相关的变量对取自然对数，建立一元线性回归；斜率项即为弹性系数，表示自变量变化1%时因变量变化的百分比，并以系数的置信区间不包含0、F检验显著、残差近似正态且随机分布作为有效性判据"
    provenance: "2023国赛E|基于小波变换和背包模型的小浪底水库最优监测方案研究|E176"

  - name: 突变点交叉验证框架
    template: "对同一时间序列分别用非参数趋势检验（以正反统计量序列的交点定位突变时刻）与有序聚类最优分割（按类内差异最小分段）识别突变点，两者结果一致时认定突变结论可靠"
    provenance: "2023国赛E|基于小波变换和背包模型的小浪底水库最优监测方案研究|E176"

  - name: 信息量约束下的0-1监测优化
    template: "设zₜ∈{0,1}表示t时刻是否监测，yₜ为t时刻携带的动态信息量（如相邻时刻差分绝对值），以总监测次数∑zₜ最小为目标，以∑zₜyₜ不低于信息量阈值（如历史月均值）为约束，构成0-1整数规划求解"
    provenance: "2023国赛E|基于小波变换和背包模型的小浪底水库最优监测方案研究|E176"

  - name: 样本分段检验再预测
    template: "把时间序列按时间顺序分为检验段与预测段，先在检验段用模型输出与已知事实对照验证可靠性，通过后再对预测段（含未来外推）应用模型，形成先证后用的预测流程"
    provenance: "2023国赛E|基于小波变换和背包模型的小浪底水库最优监测方案研究|E176"

  - name: 滚动三次指数平滑预测
    template: "对周需求量序列做三次指数平滑,用截至第t周的历史数据预测第t+1周,逐周滚动更新;平滑参数按序列趋势类型选取,预测值小于0时截断为0"
    provenance: "2022国赛E|基于时间序列预测的物料生产安排模型|E014"

  - name: 库存服务水平递推
    template: "库存量=上期库存+本期生产计划-本期实际需求(不足部分记为缺货),服务水平=1-缺货量/实际需求量,实际需求为0时服务水平定义为不存在"
    provenance: "2022国赛E|基于时间序列预测的物料生产安排模型|E014"

  - name: 区间自适应参数映射
    template: "把最近需求量变化幅度划分成若干区间,每个区间映射一个平滑参数取值,需求激增对应大参数以快速补货,需求平稳对应小参数避免积压"
    provenance: "2022国赛E|基于时间序列预测的物料生产安排模型|E014"

  - name: 库存反馈生产计划
    template: "本周生产计划=本周预测需求+上周缺货量-上周库存量,计算值非正时停产;延迟更长时在预测需求上乘放大系数β(>1)增加备货"
    provenance: "2022国赛E|基于时间序列预测的物料生产安排模型|E014"

theory_checks:
  - name: 误差指标与基线对比
    note: "至少一个统计基线（朴素/ARIMA/线性）+ 提升百分比"
    required: true
  - name: 时序划分正确性
    note: "按时间切分，防数据泄漏"
    required: true
  - name: 残差诊断
    note: "残差白噪声检验（Ljung-Box）、残差正态性（若假设正态）"
    required: false
  - name: 过拟合/复杂度
    note: "参数数 vs 样本量；训练/测试误差差距"
    required: false

antipattern:
  bad: "采用 LSTM 神经网络进行预测，训练集 RMSE=0.05，测试集 RMSE=0.32，结果如图。（无模型结构、无基线对比、无时序划分说明、测试远差于训练=过拟合未处理）"
  good: "ADF 检验显示序列非平稳，差分后平稳；建立 ARIMA(2,1,2)+外生变量 X_t；MLE 估计，残差 Ljung-Box p=0.31（白噪声）；滚动窗口验证：测试集 RMSE=0.32，较随机游走基线 0.54 提升 41%，95% 预测区间覆盖率 91%。"

failure_modes:
  - mode: wrong_abstraction
    symptom: "把分类题/评价题硬当预测题，或把截面积数据当时序"
    guard: "先确认数据的时间结构（等间隔？有依赖？）再选模型族"
  - mode: over_modeling
    symptom: "小样本硬上 LSTM/Transformer，过拟合严重（测试远差于训练）"
    guard: "样本量<千级优先统计模型；复杂模型必须给基线对比证明增益"
  - mode: unnecessary_theory
    symptom: "非线性模型硬写 ARIMA 平稳性条件，或写与模型无关的定理"
    guard: "理论性质与模型族匹配"
  - mode: forced_equation
    symptom: "为凑公式硬造误差项结构，残差诊断不通过仍写白噪声"
    guard: "残差诊断先行，诊断不通过则修改模型结构（Box-Jenkins 迭代）"

readability_guard:
  - "模型结构给出后，用一句中文说明它为什么适合这组数据（趋势/周期/非线性证据）"
  - "符号首次出现带中文含义"
  - "连续公式不超过 3 个，第 4 个前插入解释段落"
  - "误差结果必须与数据特征对应（为什么这个模型在这类数据上有效）"

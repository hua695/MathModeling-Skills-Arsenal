# MB-001 优化/规划 母蓝图（Math Reasoning Scaffold · 国赛版）
# 用途：solving 阶段按 problem_type=优化/规划 强制注入，先给数学化骨架再写代码。
# 原则：限制最低数学行为（符号化→目标→约束→求解框架→理论性质），不规定论文长什么样。
# 适用：优化与规划类问题的通用数学化骨架。

blueprint_id: MB-001
problem_type: 优化/规划
competition_variant: 国赛版
summary: 这类题的核心数学化矛盾是"把现实约束与目标转成带决策变量的极值问题"，并论证解的最优性/可行性；防止只写"用遗传算法求解"式的模型调用说明书。

abstraction_map:
  objects:
    - "资源/物品/设施 → 决策对象（每类对象一个索引集合 I, J, K…）"
    - "时段/位置/任务 → 下标维度（t, i, j）"
    - "可选项（路径/方案/组合）→ 候选集合或决策空间"
  relationships:
    - "成本/收益/距离/时间 → 参数矩阵（c_ij, d_ij, t_ij）"
    - "供需/容量/衔接关系 → 约束结构（等式/不等式/逻辑约束）"
    - "先后/互斥/依赖 → 逻辑约束（顺序、互斥、启动成本）"
  decision:
    - "是否选择/是否启用 → 0-1 变量 x_ij ∈ {0,1}"
    - "投入量/数量/流量 → 连续或整数变量 x_ij ≥ 0（或 ∈ Z+）"
    - "调度/次序 → 排列、时间窗、二元对变量（先后关系）"

symbols:
  - {sym: "I, J, K", meaning: "对象索引集合（资源/任务/设施）", unit: ""}
  - {sym: "x_ij", meaning: "决策变量（0-1 或连续，含义在正文首用处定义）", unit: "依题意"}
  - {sym: "c_ij", meaning: "成本/权重系数", unit: "依题意"}
  - {sym: "d_ij, t_ij", meaning: "距离/时间参数", unit: "km / h"}
  - {sym: "b_i", meaning: "供给/需求/容量右端项", unit: "依题意"}
  - {sym: "f(x)", meaning: "目标函数（先写集合形式再写展开式）", unit: ""}

steps:
  - step: 1
    name: 符号化
    template: "把题目要素映射为 {决策变量, 参数, 中间量} 三集合，逐一给含义与单位；正文首用处定义，符号表闭环（see WR-014）"
    required: true
  - step: 2
    name: 目标函数
    template: "min/max f(x)=…；说明 f 的单调性/凸性来源（成本线性、收益凹性等），若多目标则先声明目标间冲突并给标量化策略"
    required: true
  - step: 3
    name: 约束条件
    template: "逐条列约束并分类（资源容量/供需平衡/逻辑/衔接）；说明每条约束的现实来源；检查可行域非空（给出一个可行解构造或说明）"
    required: true
  - step: 4
    name: 模型性质判定
    template: "判定问题类别（LP/MILP/NLP/组合优化）；给出规模量级（变量数×约束数）与结构特征（是否凸、是否有整数、是否有对称性）"
    required: true
  - step: 5
    name: 求解框架
    template: "解析（KKT/闭式解/松弛）优先；数值（对偶/分支定界/启发式）需给收敛判据或间隙；启发式必须说明为何不选精确法（规模/NP-hard）"
    required: true
  - step: 6
    name: 理论性质
    template: "复杂度分析（算法 O(·)，推导来源）；可行性/最优性论证（凸性→KKT 全局最优，或下界证明）；退化情形验证（边界/零参数/对称）"
    required: false
    alternative: [复杂度分析, 收敛性论证, 极限验证]

selection_logic:
  - if: {objective: 连续, constraint: 线性, decision: 连续}
    choose: 线性规划 LP（单纯形/内点法）
    because: 凸+线性有成熟全局最优算法与对偶理论，可给间隙与影子价格
  - if: {decision: 含 0-1 或整数变量}
    choose: 整数规划 MILP（分支定界/割平面），小规模可精确解
    because: 整数性无法松弛忽略；须给出 LP 松弛下界证明间隙
  - if: {objective: 非线性, constraint: 凸}
    choose: 凸非线性规划（KKT 条件 → 全局最优）
    because: 凸性保证 KKT 点即全局最优，可作理论论证（see WR-322）
  - if: {objective: 非线性, constraint: 非凸, scale: 大}
    choose: 启发式/元启发式（SA/GA/PSO）+ 与精确法或下界对比
    because: NP-hard 无法精确求解时必须声明，并给与下界/文献的量化差距（see WR-619 贪心不等式证明）
  - if: {structure: 网络/图}
    choose: 网络流/图论算法（最短路/最大流/匹配/最小生成树）
    because: 图结构有多项式算法与理论保证，避免盲目上通用求解器

propositions:
  - name: 凸性 → 全局最优
    template: "若 f 在凸可行域上凸，则任一 KKT 点即全局最优解；证明：凸性 → 任意局部极小为全局极小，KKT 为局部极小的一阶必要条件。"
    provenance: "专家模板（建库时手工编写）"
    see: [WR-322]
  - name: LP 松弛下界
    template: "原 MILP 的最优值 ≥ 其 LP 松弛最优值；分支定界以松弛间隙 |UB-LB|/UB 为终止判据。"
    provenance: "专家模板（建库时手工编写）"
    see: [WR-223, WR-619]
  - name: 贪心准则不等式（交换论证）
    template: "假设最优解含违反贪心准则的元素，构造有限次交换后目标不劣且交换次数减少，矛盾；从而贪心即最优。"
    provenance: "专家模板（建库时手工编写）"
    see: [WR-619]
  - name: 多目标标量化
    template: "若多目标不可同时最优，用加权和/ε-约束/层次法标量化，并说明权重选取依据（归一化/敏感性），给出 Pareto 前沿（若可枚举）。"
    provenance: "专家模板（建库时手工编写）"
    see: [WR-112]

  - name: 效率因子乘积分解
    template: "系统综合效率可分解为若干相互独立的物理损失机制所对应子效率之积，各子效率先单独建模（解析或统计）再连乘合成"
    provenance: "2023国赛A|定日镜场优化设计|A092"

  - name: 多坐标系投影求交
    template: "在几何场景中建立多个局部坐标系并以旋转-平移矩阵互转，将空间遮挡/截获问题化为直线与平面（曲面）的求交与包含判定"
    provenance: "2023国赛A|定日镜场优化设计|A092"

  - name: 蒙特卡洛频率近似
    template: "当目标量为随机几何过程下的事件概率且解析式不可得时，大量随机抽样统计事件频率以近似概率，用重复次数控制精度"
    provenance: "2023国赛A|定日镜场优化设计|A092"

  - name: 对称性先验降维
    template: "利用问题的旋转对称/各向同性把逐个体决策变量聚合为逐类决策变量，降低优化维度后以粗遍历或启发式算法求解"
    provenance: "2023国赛A|定日镜场优化设计|A092"

  - name: 反射面姿态法向量定理
    template: "对任意反射面，已知入射光单位向量I与反射光单位向量R，则反射面单位法向量与向量差(R−I)同向，归一化即得；法向量的分量可反解两自由度姿态角（俯仰角与方位角）。"
    provenance: "2023国赛A|定日镜场的输出功率优化|A127"

  - name: 离散统计效率估计
    template: "对连续几何对象（镜面、光锥）按均匀网格/扇形离散为等权样本单元，逐单元判定遮挡或接收条件，用有效单元数占比估计该几何效应效率；离散分辨率决定精度上界。"
    provenance: "2023国赛A|定日镜场的输出功率优化|A127"

  - name: 同心圆分区布局生成
    template: "以中心设施为圆心划分同心环形区域，每层按最小特征间距约束向下取整确定可容纳单元数，区域间采用不同排布规则并用层间距/周向间距因子控制密度，由少量布局参数唯一生成全部单元坐标。"
    provenance: "2023国赛A|定日镜场的输出功率优化|A127"

  - name: 变步长分层搜索
    template: "目标函数对连续决策变量在箱式可行域上光滑时，先大步长枚举缩小候选区间，再以缩小后的步长（如十分之一）在子域内精细枚举；多维强耦合时先用二分法固定主导变量再细搜其余变量。"
    provenance: "2023国赛A|定日镜场的输出功率优化|A127"

  - name: 反射面法向量构造与余弦效率
    template: "给定入射单位方向与反射目标点，反射方向由两点位置差单位化得到；平面法向量取入射与反射方向之差并单位化；余弦效率为该法向量与反射方向的夹角余弦。"
    provenance: "2023国赛A|基于机理分析法的定日镜场优化设计模型|A165"

  - name: 光线-镜面遮挡判定三条件
    template: "对目标面采样点，沿入射/反射方向求其与候选邻面平面的交点；当交点落在邻面矩形投影区域内，且由采样点指向交点的向量与该光线方向同向时，判定为阴影或遮挡，否则不判定。"
    provenance: "2023国赛A|基于机理分析法的定日镜场优化设计模型|A165"

  - name: 单峰性降维寻优框架
    template: "对无解析式的多维优化目标，逐次固定其余变量、仅对一个变量做一维扫描以验证目标函数单峰性，再用三分查找求该变量极值点，逐变量确定较优解。"
    provenance: "2023国赛A|基于机理分析法的定日镜场优化设计模型|A165"

  - name: 栅格化仿真与随机搜索求效率与较优解
    template: "将连续表面离散为栅格，以栅格中心为采样点遍历光线，统计无遮挡样本占比作为效率估计；对高维随机解空间以蒙特卡洛抽样迭代更新较优解。"
    provenance: "2023国赛A|基于机理分析法的定日镜场优化设计模型|A165"

  - name: 损失机制可分离时的效率乘积分解
    template: "当系统总损失可拆分为若干个互不耦合的独立机制（几何损失、介质损失、接收损失）时，系统总效率等于各机制效率之积，可分别建模再相乘"
    provenance: "2023国赛A|定日镜场的优化设计模型|A175"

  - name: 光线-几何体求交判别定理
    template: "沿方向向量传播的参数直线与规则几何体（圆柱、矩形面）的遮挡或接收问题，可化为直线参数方程与几何体方程联立的二次判别：判别式非负且交点参数落入有效区间即判为遮挡或命中，反之不成立"
    provenance: "2023国赛A|定日镜场的优化设计模型|A175"

  - name: 邻接稀疏化降计算
    template: "若某效应只在一阶邻域内显著（如遮挡只影响相邻对象），则先按距离阈值构造邻接矩阵限定候选对象集合，可将全对计算降为局部近邻计算，复杂度由O(n^2)降为O(nk)"
    provenance: "2023国赛A|定日镜场的优化设计模型|A175"

  - name: 规则布局参数化加随机抽样的降维寻优
    template: "高维布局优化可先用规则化布局（蜂窝/网格）把海量位置变量压缩为少数结构参数（尺寸、旋转角），再用蒙特卡洛随机抽样近似目标函数做粗寻优，最后细化步长逼近局部最优"
    provenance: "2023国赛A|定日镜场的优化设计模型|A175"

  - name: 生鲜单位成本折算命题
    template: "易腐商品的单位成本等于进价乘以(1+损耗率)，将损耗显式折算进成本；该折算使补货决策中因腐损造成的代价可量化进入目标函数与损耗约束，是后续利润优化的一致性基础。"
    provenance: "2023国赛C|蔬菜类商品动态定价与补货决策研究|C050"

  - name: 周期利润最大化目标与可行域命题
    template: "计划期总利润=Σ(日销量×(定价-单位成本))-Σ(补货量×单位成本×损耗率)；可行域由四类约束界定：补货量介于预测需求与历史最大日销量之间、定价限定在单位成本的给定上下限区间、损耗与未售出之和不超过损耗率乘历史最大日销量。"
    provenance: "2023国赛C|蔬菜类商品动态定价与补货决策研究|C050"

  - name: 近期窗口需求预测命题
    template: "当序列存在季节与趋势且市场环境快速变化时，仅以最近一个周期窗口（如半年）为训练样本预测短计划期（如一周）需求，并按序列特征自动匹配季节分解类模型（简单季节性/温特斯乘性），预测值作为优化模型的销量输入。"
    provenance: "2023国赛C|蔬菜类商品动态定价与补货决策研究|C050"

  - name: 选品决策的0-1嵌入命题
    template: "当可售品种数多于要求的售卖数量时，为每个品种引入0-1采购变量，并把总品种数写成上下限约束；由此'选哪些品种、补多少、定什么价'在同一优化问题中联合决策，目标仍为总收益最大化。"
    provenance: "2023国赛C|蔬菜类商品动态定价与补货决策研究|C050"

  - name: 同期平均数据压缩
    template: "把多年份数据按同一日历位置(年-月-日对齐)取平均合成单年度序列，用于消除零膨胀与季节性冗余、压缩数据量，同时保留周期规律。"
    provenance: "2023国赛C|商超蔬菜销售数据的统计分析及建模|C126"

  - name: 业务规则定阶的VAR
    template: "当研究对象存在明确的业务寿命周期(如生鲜隔日即废)时，令VAR滞后阶数等于该寿命对应的期数，使模型阶数由业务依据确定而非硬凑。"
    provenance: "2023国赛C|商超蔬菜销售数据的统计分析及建模|C126"

  - name: MCMC收敛性诊断四件套
    template: "对贝叶斯后验样本同时检查四条：动态轨迹图收敛于后验分布、核密度单峰对称、滞后自相关衰减至0、MC误差远小于参数标准差；四条齐备则参数估计可靠。"
    provenance: "2023国赛C|商超蔬菜销售数据的统计分析及建模|C126"

  - name: 损耗放大的利润目标
    template: "收益最大化目标按“销量×定价−进货量×成本×(1+损耗率)”核算，成本端被损耗率放大；损耗率与利润率的关系用区间分段不等式约束表达而非强行拟合函数。"
    provenance: "2023国赛C|商超蔬菜销售数据的统计分析及建模|C126"

  - name: 双对数弹性回归
    template: "对响应变量与解释变量取对数建立线性回归，回归系数即为弹性，可同时估计需求对自身价格（自价格弹性）、相关商品价格（交叉弹性）与支出（支出弹性）的反应，并可用F检验、VIF检验回归质量。"
    provenance: "2023国赛C|基于价格弹性的蔬菜类商品自动定价与补货决策|C228"

  - name: 弹性销量修正函数
    template: "设基线预测销量，将决策价格通过弹性指数耦合：实际销量等于基线销量乘以（决策价格/预测价格）的弹性次幂，使纯时间序列预测结果对定价决策变量可导、可优化。"
    provenance: "2023国赛C|基于价格弹性的蔬菜类商品自动定价与补货决策|C228"

  - name: 混合编码多目标遗传算法
    template: "对同时含0-1选择变量与连续数量变量的双目标问题，采用二进制与实数混合编码，以非支配排序分层、拥挤距离保持前沿均匀、全局存档保留精英解，最后在Pareto前沿上按决策偏好选点。"
    provenance: "2023国赛C|基于价格弹性的蔬菜类商品自动定价与补货决策|C228"

  - name: 需求满足度目标函数
    template: "以0-1选择变量加权需求度之和占全体需求度之和的比例刻画需求满足程度，与收益目标构成双目标，量化表达有限货架约束下对顾客需求的满足程度。"
    provenance: "2023国赛C|基于价格弹性的蔬菜类商品自动定价与补货决策|C228"

  - name: 需求-价格外生分解
    template: "将需求时间序列分解为趋势、周期、节假日与价格外生效应四项之和；剔除前三项后，价格对需求的偏效应以线性（必要时邻域中值稳健化）函数估计，所得负偏效应可嵌入利润最大化优化模型。"
    provenance: "2023国赛C|基于历史数据的蔬菜类商品定价与补货决策模型|C235"

  - name: 预测-优化滚动耦合
    template: "当优化决策改变下一期预测的输入序列时，逐期执行：用当期最优决策回填历史数据后再预测下一期，形成预测与优化交替的滚动耦合，保证决策时序与预测逻辑一致。"
    provenance: "2023国赛C|基于历史数据的蔬菜类商品定价与补货决策模型|C235"

  - name: 软约束二进制松弛
    template: "多组硬约束无法同时满足时，为每组约束引入配对的0-1辅助变量，将'全部满足'松弛为'至少K组满足'，保持混合整数规划结构并给出可解释的松弛代价。"
    provenance: "2023国赛C|基于历史数据的蔬菜类商品定价与补货决策模型|C235"

  - name: 同期窗口需求常数化
    template: "将待预测日的随机需求定义为历史同期窗口（目标日所在月份区间）内剔除异常与低利润记录后的日均销量，使需求成为常数约束，既保留季节性又去除日噪声。"
    provenance: "2023国赛C|基于历史数据的蔬菜类商品定价与补货决策模型|C235"

  - name: 周期平移等价性
    template: "若多批次按固定间隔启动且各批次内部状态时序相同, 则进入稳定期后每日资源占用序列可由单批次序列经平移叠加得到, 平均占用率可仅由单周期核算"
    provenance: "2023国赛D|圈养湖羊空间利用率的优化问题|D039"

  - name: 羊栏天数折算估计
    template: "把每阶段资源占用折算为'数量×时长/容量'合计(栏·天), 年化产出=可用资源总量×单周期产出率/单周期总栏天数, 据此可估计产出范围与资源缺口"
    provenance: "2023国赛D|圈养湖羊空间利用率的优化问题|D039"

  - name: 随机分支离散化
    template: "将多取值/连续的随机时长按分布质量抹平归并到若干整齐分支, 使每个分支有确定时间区间, 并选择能被关键时点整除的周期边界对齐, 把随机问题转为确定性分支排产"
    provenance: "2023国赛D|圈养湖羊空间利用率的优化问题|D039"

  - name: 稳定段蒙特卡洛期望
    template: "对随机系统做充分多周期模拟, 舍弃暂态取内部平稳区间的样本均值作为目标函数期望, 再对低维决策变量枚举寻优"
    provenance: "2023国赛D|圈养湖羊空间利用率的优化问题|D039"

  - name: 导数图元判别准则
    template: "对分段光滑平面曲线,按采样点的一阶差分导数的量级区分直线段(非零常数)与水平段(近似零),按二阶差分导数的量级区分圆弧段(显著非零),并设阈值容忍噪声偏差"
    provenance: "2020国赛D|基于接触式轮廓仪测量数据的工件形状自动标注方法|2020D"

  - name: 滑动窗口均值去噪
    template: "将相邻样本按固定窗口分块,取窗口内导数均值作为该区间的代表值,通过窗口是否重叠调节平滑强度,配合上下阈值把区间划分为若干图元类别"
    provenance: "2020国赛D|基于接触式轮廓仪测量数据的工件形状自动标注方法|2020D"

  - name: 刚体旋转校正
    template: "由多条同方向直线斜率的平均估计整体旋转角,用二维旋转矩阵把倾斜坐标旋转回水平,再以特征点(如圆心)的均值差作平移对齐"
    provenance: "2020国赛D|基于接触式轮廓仪测量数据的工件形状自动标注方法|2020D"

  - name: 多组数据基准拼接
    template: "将各次测量先校正到同一坐标系,选取稳定特征点作为公共基准完成平移对齐,再按横坐标范围取并集拼接完整轮廓,并以高精度局部段参数替换全局对应段"
    provenance: "2020国赛D|基于接触式轮廓仪测量数据的工件形状自动标注方法|2020D"

  - name: 导数零判别基元分类
    template: "对平面轮廓的离散采样以差分近似导数: 一阶导数恒为常数则该段为直线(恒为零为水平线), 二阶导数非零则该段为圆弧; 用窗口统计量与阈值做鲁棒化后即为可编程的分类规则。"
    provenance: "2020国赛D|基于接触式轮廓仪测量数据的工件形状自动标注方法|2020D"

  - name: 滑动窗口平均去噪
    template: "含噪信号的差分序列按固定窗口取均值/方差统计以抑制随机扰动, 阈值判别窗口所属模式; 窗口是否重叠会改变边缘短段的可识别性, 应对比后选择并保留证据。"
    provenance: "2020国赛D|基于接触式轮廓仪测量数据的工件形状自动标注方法|2020D"

  - name: 多源数据拼接与局部替代
    template: "多组覆盖同一对象的数据先各自旋转到统一姿态, 以公共显著特征(如第一个圆)为基准平移对齐, 再按坐标范围拼接; 对更高精度的局部数据, 先与全局对应区域做参数匹配确认, 再以局部参数替代全局参数修正整体。"
    provenance: "2020国赛D|基于接触式轮廓仪测量数据的工件形状自动标注方法|2020D"

  - name: 分段基元拟合与交点边界
    template: "若平面轮廓由若干类简单几何基元(水平线段、斜线段、圆弧)分段组成, 则按基元类型分别用最简参数形式(常数、线性、圆方程)拟合各段, 再将相邻段的拟合方程联立求解交点, 交点既作为分段边界又作为参数计算的几何依据。"
    provenance: "2020国赛D|接触式轮廓仪校准问题|2020D"

  - name: 同向线段斜率均值估计倾角
    template: "对同一对象两次姿态的测量, 若各姿态下存在多条同向直线段, 则其斜率随倾角单调变化; 取多条对应线段的斜率均值构造角度估计可抑制单条线的随机误差, 再用平面旋转逆变换把倾斜测量还原到水平坐标系。"
    provenance: "2020国赛D|接触式轮廓仪校准问题|2020D"

  - name: 特征点平移对齐融合多源数据
    template: "对同一对象的多组重复或局部测量, 选择形态上可稳定识别的公共特征点(轮廓最高点、最低点、圆弧最低点), 通过平移使特征点重合, 再合并全部测量点统一拟合, 从而把分散的多源数据融合成一份完整数据。"
    provenance: "2020国赛D|接触式轮廓仪校准问题|2020D"

  - name: 局部高精度参数替换修正
    template: "当存在比全局测量更高精度的局部测量时, 只对该局部涉及的关键参数(如半径、弧长、夹角)用局部数据拟合出标准值, 与全局参数对比后替换, 再据此重构完整轮廓, 实现以局部精度带动全局修正。"
    provenance: "2020国赛D|接触式轮廓仪校准问题|2020D"

  - name: 零报废切割充要条件
    template: "一段长度为L的连续材料按目标区间[a,b]内的等长段整数等分切割时，报废长度为零当且仅当L可表为目标区间端点a或b的整数倍（存在整数n使na≤L≤nb且可整除）；否则报废必大于零"
    provenance: "2021国赛D|连铸切割的在线优化模型|D017"

  - name: 最小损失分段线性结构
    template: "按精度离散化后，切割总损失最小值是材料总长度的分段线性函数，分段端点由目标区间端点及其整数倍确定，各段斜率为0或1"
    provenance: "2021国赛D|连铸切割的在线优化模型|D017"

  - name: 两阶段分层目标求解
    template: "具有主次优先级的多目标优化可拆为：先求主目标最优值，再在主目标最优值固定的约束下优化次目标"
    provenance: "2021国赛D|连铸切割的在线优化模型|D017"

  - name: 固定废坏并入组合切割
    template: "固定长度的报废段可与相邻正常段合并成可切割单元，使总损失最小的损失函数是原函数在平移参数下的分段形式"
    provenance: "2021国赛D|连铸切割的在线优化模型|D017"

  - name: 序贯求解最优解转化性质
    template: "多目标按优先级序贯求解：先优化最重要目标，把其最优值作为等式约束再优化次目标，逐级下传，最终解同时满足各级目标的最优性"
    provenance: "2021国赛D|连铸切割的在线优化|D026"

  - name: 报废段附着切除性质
    template: "含报废段的钢坏先按去除报废段后的长度求最优切割方案；有损失段则报废段附着于最小损失段切除，无损失则附着于最长段，再离线二次切割分离"
    provenance: "2021国赛D|连铸切割的在线优化|D026"

  - name: 长度守恒切割约束
    template: "任一钢坏被切成若干段，各段长度之和等于原长，即离散化长度与根数乘积之和对每种钢坏构成等式约束"
    provenance: "2021国赛D|连铸切割的在线优化|D026"

  - name: 时间窗口方案叠加性质
    template: "以异常时刻划分时间窗口，任一时段的累计切割方案等于该时段自身方案与其前所有时间单元方案之和，用于构造初始方案与调整方案"
    provenance: "2021国赛D|连铸切割的在线优化|D026"

  - name: 损失浮动区间定理
    template: "按目标值切分得基础损失，目标范围差乘以段数得总浮动量，最优损失位于基础损失加减总浮动量构成的区间内，按剩余量对单段浮动步长取模可构造无余料的最优组合"
    provenance: "2021国赛D|连铸切割的在线优化|2021_D_D034"

  - name: 报废段合并准则
    template: "当相邻两段最小损失之和加上两段间固定报废段长度落在可运走长度区间内时，将损耗与报废段合并切割可优化工序；当相邻报废段间钢坯长度落在特定区间时合并可减少损耗"
    provenance: "2021国赛D|连铸切割的在线优化|2021_D_D034"

  - name: 参数化通用算法
    template: "将目标值与目标范围设为可重赋值参数，同一套分支算法通过参数替换适配不同用户需求与任意输入长度"
    provenance: "2021国赛D|连铸切割的在线优化|2021_D_D034"

  - name: 成分数据变换-分析-逆变换流程
    template: "对定和为常数的成分数据，先经中心化对数比变换解除定和约束，在变换空间进行统计与回归建模，再经逆变换还原，保证预测结果满足累加和约束"
    provenance: "2022国赛C|基于成分数据的古代玻璃制品的成分分析与鉴别|2022_C_C155"

  - name: 卡方检验前提判定与校正
    template: "当超过20%的单元格期望计数小于5时Pearson卡方检验不可信，改用将观测值与期望值之差减0.5的Yates校正统计量"
    provenance: "2022国赛C|基于成分数据的古代玻璃制品的成分分析与鉴别|2022_C_C155"

  - name: R型聚类引导的Q型聚类
    template: "对高维相关变量先用变量聚类压缩为若干代表特征，再基于代表特征对样本聚类，使亚类划分兼具降维与可解释性"
    provenance: "2022国赛C|基于成分数据的古代玻璃制品的成分分析与鉴别|2022_C_C155"

  - name: 广播轮次下界与可达
    template: "全信息共享所需最小轮次不低于信息总量与单轮最大传输容量之比，且该下界可通过对称构造的传输方案取到"
    provenance: "2022国赛D|气象报文信息卫星通信传输|D999"

  - name: 冗余并传概率提升
    template: "单通道成功概率p不足时，双通道并传使成功概率升至1-(1-p)的平方，可将该并传组合视为一个整体单元参与调度"
    provenance: "2022国赛D|气象报文信息卫星通信传输|D999"

  - name: 二项分布期望评估
    template: "各接收节点独立以概率p获得某信息时，成功节点数服从二项分布，其期望用于量化方案的整体接收效果"
    provenance: "2022国赛D|气象报文信息卫星通信传输|D999"

  - name: 超量产出的分段收益拆分
    template: "当产量X超过需求D时,收益=min(X,D)·p + α·max(X-D,0)·p - 成本,α∈[0,1]为过剩部分折扣系数(α=0对应滞销浪费,α=0.5对应半价),将'供过于求的处理方式'参数化进目标函数,一次建模即可比较多种情境"
    provenance: "2024国赛C|基于差分遗传算法的农作物种植策略优化|C038"

  - name: 滚动窗口覆盖约束(轮作要求)
    template: "为满足'每块地在W年内至少执行一次某类动作(如种植豆类)',对每个长度为W的滑动窗口内的0-1动作变量求和并令其≥1,窗口逐年滑动覆盖全部时段"
    provenance: "2024国赛C|基于差分遗传算法的农作物种植策略优化|C038"

  - name: 相邻期互斥约束(禁重茬)
    template: "对同一地块连续两期的0-1种植变量z_t与z_(t+1)施加z_t+z_(t+1)≤1,禁止相邻期种植同一种作物;若地块一年两季,还需跨年衔接(上年第二季与下年第一季互斥)"
    provenance: "2024国赛C|基于差分遗传算法的农作物种植策略优化|C038"

  - name: 期望收益-CVaR双目标风险控制
    template: "优化目标=期望总收益 - λ·CVaR_α(损失),其中CVaR_α为超过VaR_α(置信水平α下最大损失的尾部平均损失);可用蒙特卡洛情景集排序后取最差(1-α)比例损失的均值近似,并以惩罚项形式嵌入进化算法适应度函数"
    provenance: "2024国赛C|基于差分遗传算法的农作物种植策略优化|C038"

  - name: 滞销截断收益函数
    template: "当产量受预期销量上限约束时,收益=单价×min(产量,预期销量),并可叠加超出部分的折价项;该处理把销售限制直接嵌入目标函数,避免引入额外约束"
    provenance: "2024国赛C|基于优化算法的农作物最优种植模型|C063"

  - name: 轮作与最小占比的线性化约束
    template: "连续重茬限制可用相邻时段同作物种植面积和≤地块面积的线性不等式表达,豆类轮作用三年内豆类面积和≥地块面积表达,最小占比用面积≥占比×地块面积表达,从而保持模型线性可全局求解"
    provenance: "2024国赛C|基于优化算法的农作物最优种植模型|C063"

  - name: 益损值矩阵多准则决策
    template: "对不确定决策,先按分布抽样若干环境状态并为每种状态求最优方案,计算各方案在各状态下的收益构成益损值矩阵,再按乐观(行最大值)、期望(行均值)、悲观(行最小值后取最大)准则选择方案"
    provenance: "2024国赛C|基于优化算法的农作物最优种植模型|C063"

  - name: 替代互补系数耦合模型
    template: "作物间关系可定义为耦合系数:替代系数把互为替代作物的种植面积关联(一方减少另一方增加),互补系数对亩产量做乘性修正,再代入原优化模型,使模型反映现实关联并增强稳定性"
    provenance: "2024国赛C|基于优化算法的农作物最优种植模型|C063"

  - name: 大M线性化耦合
    template: "连续决策变量与0-1指示变量的耦合可通过大M不等式线性化：x≤M·y（上界）与x≥ε·y（下界），ε为最小种植单位"
    provenance: "2024国赛C|基于随机优化的农作物种植策略模型|C094"

  - name: 滚动轮作覆盖约束
    template: "“任意连续K年每块地至少种植一次某类作物”可写为：对任意起始年t，该类作物在[t,t+K-1]窗口内的种植面积之和不小于该地块面积"
    provenance: "2024国赛C|基于随机优化的农作物种植策略模型|C094"

  - name: 场景期望随机规划
    template: "参数不确定时，在场景集S上以各场景概率P(s)加权最大化目标期望E(income)=ΣP(s)·income(s)，并保持约束对每个场景可行"
    provenance: "2024国赛C|基于随机优化的农作物种植策略模型|C094"

  - name: 替代因子需求转移
    template: "两种可替代品之间用替代因子α∈[0,1]将部分需求量从被替代品线性转移到替代品：新需求=(1-α)原需求，替代品需求增加α倍原需求，总需求不变"
    provenance: "2024国赛C|基于随机优化的农作物种植策略模型|C094"

  - name: 多年利润总和单目标规划
    template: "以逐期（年-地-季-品）数量或面积为决策变量，把多期总收益（正常销售收益+超出部分处理收益-总成本）作为单目标，叠加耕地容量、最小规模、轮作重茬、品类匹配等线性约束，构成单目标线性/混合整数规划"
    provenance: "2024国赛C|基于遗传算法的最优种植策略|C234"

  - name: 均匀分布不确定因子修正模型
    template: "对受不确定性影响的指标（销量、亩产、成本、价格）引入服从均匀分布的年变化率，自基准期逐期累乘修正；变化率为定值时均匀分布退化为该定值"
    provenance: "2024国赛C|基于遗传算法的最优种植策略|C234"

  - name: 灾害减产因子修正
    template: "对特定季次与作物类别的亩产量乘以常数损失因子（如减产比例），非对应季次取1，用于刻画极端天气对不同作物的差异化影响"
    provenance: "2024国赛C|基于遗传算法的最优种植策略|C234"

  - name: 替代品/互补品集合修正
    template: "将商品按替代或互补关系划分类集合：替代集合内按价格权重分配总需求量，互补集合内按价格变化最大的商品同比例调整集合内销售量，再用一次函数建立需求量与价格、成本的负相关关系"
    provenance: "2024国赛C|基于遗传算法的最优种植策略|C234"

  - name: 深度区间最优定理
    template: "对固定水平落点，当引爆深度位于目标上下表面之间时命中概率最大，因为该情形的可命中区域包含其余四种情形的可命中区域"
    provenance: "2024国赛D|反潜航空深弹命中概率的优化问题|2024_D_D033"

  - name: 定长区间正态积分最大化引理
    template: "对均值为零的正态密度，定长积分区间在原点居中时积分值最大，据此证明水平落点取定位点最优"
    provenance: "2024国赛D|反潜航空深弹命中概率的优化问题|2024_D_D033"

  - name: 条件概率分解定理
    template: "当深度误差与水平误差独立时，总命中概率等于深度条件命中概率对深度密度求积分，可在深度维上按相对位置分情形分段积分再求和"
    provenance: "2024国赛D|反潜航空深弹命中概率的优化问题|2024_D_D033"

  - name: 流量时段聚类划分
    template: "将一天各小时流量向量作为样本聚类，可得到客观的时段划分；用轮廓系数等内部指标在多个聚类算法间裁决临界时刻"
    provenance: "2024国赛E|交通流量管控|E010"

  - name: 停车周转率折算
    template: "给定平均停车时长与假期总时长可得车位周转率，停车位需求约等于巡游车辆总数除以周转率，可折算日均增量"
    provenance: "2024国赛E|交通流量管控|E010"

  - name: 速度-绿信比反比
    template: "交叉口平均车速随绿信比（绿灯时长/周期）增大而提高，据此构建以平均车速最大为目标的配时优化模型"
    provenance: "2024国赛E|交通流量管控|E010"

  - name: 单点最优周期结构
    template: "单点信号最优周期由总损失时间与流量比和决定，各相位绿灯时长按流量比分配，可用于逐交叉口配时"
    provenance: "2024国赛E|交通流量管控|E010"

  - name: 聚类时段划分
    template: "以小时粒度车流量为特征向量,标准化后做K-Means聚类,以组内平方和(WCSS)肘部法确定聚类数,将时间轴划分为若干类时段"
    provenance: "2024国赛E|基于多目标优化的交通管理评估分析|E061"

  - name: 比例约束寻优分配
    template: "在方向比例之和为1的约束下,以估算分向流量之和与实际总流量之差的绝对值为目标,用群体智能算法迭代寻优比例参数"
    provenance: "2024国赛E|基于多目标优化的交通管理评估分析|E061"

  - name: 双条件事件判定
    template: "对满足“属性低于阈值”与“时间窗内访问频次达到下限”两个独立条件的对象集合取交集,作为目标事件的判定结果"
    provenance: "2024国赛E|基于多目标优化的交通管理评估分析|E061"

  - name: 泊松分位点需求估计
    template: "以事件平均发生率λ乘以单位换算系数得到泊松参数,取累积分布函数达到置信水平(如0.95)的最小整数作为资源需求上界"
    provenance: "2024国赛E|基于多目标优化的交通管理评估分析|E061"

  - name: 时段聚类的流量估算
    template: "当需按时段估算流量时,先按日期类型(工作日/非工作日/节假日)分层,再对小时流量做K-means聚类自动划分低峰/高峰/平峰,再按转向比例公式把总流量拆分为直行/转弯流量,避免手工设段的主观性"
    provenance: "2024国赛E|基于Python语言的交通流量管控与预测分析|E218"

  - name: 绿灯时长分配的组合优化
    template: "信号配时优化可建模为在周期约束下最大化各方向通行能力加权和的组合优化,以绿灯时长为决策变量,适应度函数取通行能力之和,用遗传算法搜索最优配时"
    provenance: "2024国赛E|基于Python语言的交通流量管控与预测分析|E218"

  - name: 排队论停车需求估算
    template: "停车需求可用M/M/c排队模型刻画:由巡游车辆到达率与服务率计算利用率,用Erlang C公式求无车概率与平均排队长度,以系统稳定(利用率<1)确定所需服务台(停车位)数量,给出区间估计"
    provenance: "2024国赛E|基于Python语言的交通流量管控与预测分析|E218"

  - name: 管控效果的多指标对比评价
    template: "政策措施效果评价可选取可量化指标(流量密度、绕行车辆占比、通行方向合规),计算实施期与参照期的指标值及变化百分比,逐指标解读变化方向并综合判断措施成效"
    provenance: "2024国赛E|基于Python语言的交通流量管控与预测分析|E218"

  - name: 外轮廓遮蔽引理
    template: "若凸物体在点光源下的外轮廓被完全遮挡，则轮廓内部所有表面点亦被遮挡；对圆柱体，外轮廓可简化为上下底面圆周"
    provenance: "2025国赛A|多情形下无人机烟幕遮蔽策略的建模与优化研究|A196"

  - name: 连续有效时段命题
    template: "匀速单调运动下遮挡几何关系随时间连续单调演化，完全遮蔽持续时间为单一连续区间，可用二分查找精确求端点"
    provenance: "2025国赛A|多情形下无人机烟幕遮蔽策略的建模与优化研究|A196"

  - name: 拦截重合降维
    template: "令弹着物中心与来袭目标在某时刻位置重合，由垂直方向运动方程解出自由落体时间比例s，由水平方向方程解出所需速度，将高维搜索降为对时刻的一维搜索"
    provenance: "2025国赛A|多情形下无人机烟幕遮蔽策略的建模与优化研究|A196"

  - name: 分层任务分配分解
    template: "大规模多对多分配-调度问题可先以（整数）线性规划求任务分配，再分解为独立子问题分别优化，最后按集合交集/并集组合全局目标"
    provenance: "2025国赛A|多情形下无人机烟幕遮蔽策略的建模与优化研究|A196"

  - name: 比例响应的混合效应建模
    template: "对(0,1)区间比例响应做logit变换消除边界约束，再以带随机截距与随机斜率的线性混合效应模型刻画纵向重复测量数据的组内相关与个体异质性"
    provenance: "2025国赛C|基于混合效应模型的NIPT时点优化与胎儿异常判定|C023"

  - name: 达标时间与风险最小化决策
    template: "最早达标时间定义为达标概率首次不低于给定置信水平的时刻；推荐时点由技术失败风险与时间风险之和的期望最小化决定，并施加单调性等临床约束"
    provenance: "2025国赛C|基于混合效应模型的NIPT时点优化与胎儿异常判定|C023"

  - name: 分段决策的动态规划
    template: "将连续自变量域离散化后，预计算每个区间-候选决策组合的代价，再用动态规划状态转移求解分段边界与段内决策的联合优化"
    provenance: "2025国赛C|基于混合效应模型的NIPT时点优化与胎儿异常判定|C023"

  - name: 校准零分布与多重检验判定
    template: "以阴性对照样本回归残差构造稳健零分布（中位数与MAD），样本标准化后按零分布求p值并做FDR校正，配合双阈值与重复一致性聚合输出分级结论"
    provenance: "2025国赛C|基于混合效应模型的NIPT时点优化与胎儿异常判定|C023"

  - name: 层次数据混合效应建模
    template: "对重复测量数据,以固定效应刻画解释变量的总体平均效应、随机截距刻画个体间变异,用REML估计,以似然比检验与组内相关系数(ICC)验证随机效应必要性"
    provenance: "2025国赛C|基于统计建模与元学习的NIPT检测决策优化与异常识别|C132"

  - name: 稀疏数据保守推断流程
    template: "按观测点数量分流:单点观测直接判定,多点观测先检验趋势方向,相关方向合理才用高斯过程外推并取95%置信下界首个达标点,再与实测达标点取保守较小值并做边界截断"
    provenance: "2025国赛C|基于统计建模与元学习的NIPT检测决策优化与异常识别|C132"

  - name: 时点风险分段赋权
    template: "将连续检测时点按临床风险划分为若干区间并赋不同权重,总风险为各分组人数乘以组内推荐时点对应权重的加和,配合分割点有序、组规模下限等约束做最小化"
    provenance: "2025国赛C|基于统计建模与元学习的NIPT检测决策优化与异常识别|C132"

  - name: 堆叠元学习诊断
    template: "先用多个专项模型对各类异常分别输出概率作为元特征,与关键原始特征融合成综合矩阵,再由元模型做多分类,最后用领域规则(如Z值阈值)对稀有类别做逻辑修正兜底"
    provenance: "2025国赛C|基于统计建模与元学习的NIPT检测决策优化与异常识别|C132"

  - name: 速度突变事件识别
    template: "瞬态运动事件（起跳/落地/撞击）可通过对平滑位移序列求一阶差分得到速度序列，并与设定阈值比较自动定位事件时刻"
    provenance: "2025国赛E|基于姿态识别的AI辅助智能体测研究|E030"

  - name: 比例尺一致性验证
    template: "固定采集参数下，用已知真实量纲值除以像素位移定义比例尺；多个独立样本得到一致比例尺即为自动识别可靠性的证据"
    provenance: "2025国赛E|基于姿态识别的AI辅助智能体测研究|E030"

  - name: 共线性诊断与特征筛选
    template: "当特征两两相关系数普遍接近1时存在多重共线性，应结合领域机理选择代表性变量而非全部入模，以保证模型稳定可解释"
    provenance: "2025国赛E|基于姿态识别的AI辅助智能体测研究|E030"

  - name: 标准化回归贡献度
    template: "对自变量做Z-score标准化后，以标准化回归系数绝对值占总绝对值之和的比例度量各因素对因变量的相对贡献"
    provenance: "2025国赛E|基于姿态识别的AI辅助智能体测研究|E030"

theory_checks:
  - name: 复杂度分析
    note: "算法 O(·) 必须给推导，不许只写结论"
    required: true
  - name: 最优性/可行性论证
    note: "凸→KKT；组合→下界+间隙；至少给可行解构造"
    required: true
  - name: 极限/退化验证
    note: "边界情形（α→0、容量→∞、对称退化）应退化为已知结果"
    required: false

antipattern:
  bad: "使用遗传算法求解，种群 500，迭代 1000 次，得到最优解 xxx。（无目标函数、无约束、无为何不精确解的论证）"
  good: "将问题形式化为 0-1 整数规划 (P1)：min Σc_ij x_ij s.t. Σ_j x_ij ≥ 1 ∀i, x_ij∈{0,1}；松弛为 LP (P2) 得下界 L=…；分支定界 15s 收敛至间隙 1.2%，优于遗传算法 3.7%。"

failure_modes:
  - mode: wrong_abstraction
    symptom: "把连续量硬当 0-1 变量、或把非决策的量设为决策变量"
    guard: "abstraction_map 先自检：每个决策变量都能对应题中一个真实的『选什么』答案"
  - mode: over_modeling
    symptom: "简单问题硬套大规模 MILP/复杂启发式，求解器跑不动"
    guard: "baseline-gate 先验证简单解可达 80%，复杂化必须有收益证据（ablation）"
  - mode: unnecessary_theory
    symptom: "不凸的问题硬写 KKT、无界的题写收敛性"
    guard: "理论性质与模型类别匹配（selection_logic 判定类别后再选性质）"
  - mode: forced_equation
    symptom: "为凑公式编号硬造等式，公式不被后续引用"
    guard: "check_math_contract 的推导链/引用密度检查；公式应被后续公式或结果引用"

readability_guard:
  - "每段数学推导后必须有 1 句自然语言解释（这段在做什么、为什么）"
  - "符号首次出现必须带中文含义（即使符号表已定义）"
  - "连续公式不超过 3 个，第 4 个前插入解释段落"
  - "目标函数/约束给出后，用一句中文重述其现实含义"

# MB-002 机理/物理 母蓝图（Math Reasoning Scaffold · 国赛版）
# 用途：solving 阶段按 problem_type=机理/物理 强制注入，先从第一性原理推导再写代码。
# 原则：机理题的分水岭是"方程从守恒律/基本定律推导出来"还是"直接调用库函数拟合"。

blueprint_id: MB-002
problem_type: 机理/物理
competition_variant: 国赛版
summary: 这类题的核心数学化矛盾是"把物理/工程过程拆成主导机制并逐机制给出数学表达"；防止只写"用有限元/仿真软件算一下"式的黑箱调用。

abstraction_map:
  objects:
    - "物理实体/系统 → 连续介质、质点系、状态向量（u(x,t) 或 x(t)）"
    - "场量（温度/浓度/电磁场）→ 时空函数 u(x,t)"
    - "子过程/阶段 → 分段机制（各段主导方程不同）"
  relationships:
    - "守恒律（质量/能量/动量）→ 微分方程或积分方程"
    - "本构关系（传热/扩散/弹性）→ 方程中的参数项（傅里叶/菲克/胡克）"
    - "边界/初始条件 → 定解条件（Dirichlet/Neumann/初值）"
  decision:
    - "待定参数（热时间常数/对流系数/扩散系数）→ 由数据标定的未知量（see WR-635）"
    - "控制量（温度曲线/工艺参数）→ 优化变量"

symbols:
  - {sym: "u(x,t)", meaning: "场量（温度/浓度/位移），首用处定义", unit: "K / mol·m⁻³ / m"}
  - {sym: "x, t", meaning: "空间坐标/时间", unit: "m / s"}
  - {sym: "D, k, h", meaning: "扩散系数/导热系数/对流换热系数", unit: "m²·s⁻¹ / W·m⁻¹·K⁻¹ / W·m⁻²·K⁻¹"}
  - {sym: "α, ρ, c_p", meaning: "热扩散率/密度/比热", unit: "m²·s⁻¹ / kg·m⁻³ / J·kg⁻¹·K⁻¹"}
  - {sym: "τ", meaning: "时间常数（机理拟合参数）", unit: "s"}

steps:
  - step: 1
    name: 机制拆解
    template: "把过程拆成 N 个明确阶段，说明各阶段主导机制（如蒸发→析出→成核→长大），每阶段给物理依据（see WR-556/635）"
    required: true
  - step: 2
    name: 第一性原理推导
    template: "用守恒律+本构关系从零推导方程（如能量守恒+傅里叶定律 → 热传导方程），标明每个近似假设及其物理理由（see WR-637）"
    required: true
  - step: 3
    name: 定解条件
    template: "给出初值/边界条件，说明其现实来源；检查定解问题适定性（存在唯一稳定，see WR-213）"
    required: true
  - step: 4
    name: 求解路径
    template: "解析（分离变量/拉普拉斯变换/特征线）优先；数值（有限差分/有限元/ODE 求解器）需给离散格式与稳定性条件（CFL 等）。注意：此处只定求解方法类别（解析/数值），具体模型与算法选择由 FD/SD 库检索决定，蓝图不锁定具体模型名"
    required: true
  - step: 5
    name: 参数标定与验证
    template: "不可直接测量的参数用数据标定（最小二乘/拟合），给出拟合误差；用独立数据/仿真交叉验证（see WR-235 由简到繁）"
    required: true
  - step: 6
    name: 理论性质
    template: "稳态解存在性/稳定性分析（线性化/李雅普诺夫/特征值判据）；退化情形（均匀场/稳态/无源）应退化为已知解析结果"
    required: false
    alternative: [稳态分析, 稳定性判据, 退化极限]

selection_logic:
  - if: {mechanism: 传导/扩散/波动, geometry: 规则}
    choose: 解析解（分离变量/傅里叶级数）
    because: 规则几何+线性方程有闭式解，可做极限验证与参数显式分析
  - if: {mechanism: 传导/扩散, geometry: 复杂, data: 实测}
    choose: 数值（有限差分/有限元）+ 实测数据标定参数
    because: 复杂几何无解析解，但数值解需给离散稳定性条件
  - if: {process: 分阶段, mechanism: 各段不同}
    choose: 分段模型（各段方程独立推导，衔接处给连续性条件）
    because: 逐段主导机制不同，统一方程无法表达（see WR-556）
  - if: {parameter: 不可直接测量}
    choose: 数据驱动标定（最小二乘/优化拟合）嵌入机理模型
    because: 机理+数据融合：方程结构保可解释，参数由数据定（see WR-635）
  - if: {system: 多体/耦合}
    choose: 方程组/状态空间 + 数值积分（Runge-Kutta 等）
    because: 耦合系统需联立求解，状态空间形式便于稳定性和可观性分析

propositions:
  - name: 能量守恒推导（传热）
    template: "对微元体列能量守恒：ρc_p ∂u/∂t = ∇·(k∇u)；稳态无源退化为 ∇²u=0（拉普拉斯方程）。"
    provenance: "2023 国赛B 回焊炉问题，一维稳态传热（专家拆解）"
    see: [WR-637, WR-635]
  - name: 稳态解存在性
    template: "若边界条件相容且方程系数有界，稳态问题存在唯一解；证明：线性椭圆方程的最大值原理/能量估计。"
    provenance: "专家模板（建库时手工编写）"
    see: [WR-213]
  - name: 时间常数拟合
    template: "升温段 T(t)=T_∞+(T_0−T_∞)e^(−t/τ)，τ 由实测曲线最小二乘标定；降温段用牛顿冷却公式同理。"
    provenance: "2023 国赛B（专家拆解）"
    see: [WR-12491 区块]
  - name: 退化极限验证
    template: "令非主导机制参数→0 或→∞，方程应退化为已知简化结果（如 α→0 平坦极限），作为推导正确性检验。"
    provenance: "专家模板（建库时手工编写）"
    see: [WR-655]

  - name: 测线沿等深线方向最优性命题
    template: "在深度沿单一方向线性变化的海底坡面上，任意方向测线段的覆盖条带面积为等腰梯形，而平行等深线的等长测线覆盖面积为矩形；因覆盖宽度关于深度单调且中点深度为两端深度均值，可证矩形面积不小于梯形面积，故平行等深线方向使单位测线长度的覆盖面积最大。"
    provenance: "2023国赛B|多波束测线布设|B226"

  - name: 条带覆盖宽度左右分解命题
    template: "波束扇形关于换能器垂线对称时，条带覆盖宽度可分解为左右两半覆盖宽度之和；每一半由该处海水深度、开角与坡面倾角经三角形正弦定理确定，重叠率定义为相邻条带重叠区长度与该条带覆盖宽度之比，可沿测线位置序列递推计算。"
    provenance: "2023国赛B|多波束测线布设|B226"

  - name: 三维测深参数投影降维命题
    template: "测线方向所在铅垂面与海底坡面的交线方向向量等于两平面法向量的叉积；由交线点向式方程可求沿测线任意位置的海水深度，覆盖宽度所在直线与水平面夹角由线面角公式给出，从而将三维覆盖宽度计算降维为二维模型输入。"
    provenance: "2023国赛B|多波束测线布设|B226"

  - name: 全覆盖约束的累加式表述
    template: "条带间存在重叠时，一组平行测线对海域的全覆盖等价于各条带沿测线间距方向的投影覆盖长度之和减去重叠部分后不小于海域宽度；该约束与逐条重叠率区间约束共同构成测线布设优化模型的可行域。"
    provenance: "2023国赛B|多波束测线布设|B226"

  - name: 坡面条带覆盖宽度分解
    template: "在坡度角α、换能器开角θ、水深随位置线性变化的斜坡上,条带覆盖宽度等于左右两半宽之和,每半宽为水深乘以由开角与坡角构成的三角因子;当测线偏离坡向时,该因子中的坡角替换为测线方向对应的线面角。"
    provenance: "2023国赛B|基于主要目标法的测线设计问题|B311"

  - name: 任意方向测线的线面角分解
    template: "测线沿坡面任意方向延伸时,测线及其条带宽度线与水平面的线面角可表为坡度α与测线方向角β的三角函数(含关于β的余弦类因子);由此三维问题回归为二维公式的参数替换。"
    provenance: "2023国赛B|基于主要目标法的测线设计问题|B311"

  - name: 临界重叠率递推设计
    template: "给定重叠率下限与边界对齐的首条测线,相邻测线间距由“重叠率=重叠宽度/覆盖宽度”的隐式方程确定,逐条递推直至覆盖区域边界,测线数量即递推步数;若末条未能覆盖边界则补线并调整重叠率。"
    provenance: "2023国赛B|基于主要目标法的测线设计问题|B311"

  - name: 最宽处全覆盖判据
    template: "沿等深线布设测线时,若两条等高线间沿梯度方向水平距离最大处达到全覆盖(重叠率恰好不低于临界值),则该条带内所有区域均被覆盖;等高距由最宽处确定并沿梯度方向递推。"
    provenance: "2023国赛B|基于主要目标法的测线设计问题|B311"

  - name: 航向-坡度唯一性
    template: "在平面海底假设下，测线航向（水平投影方向）唯一决定该方向上的坡度且为定值；坡线方向由海平面与过航向法向的竖直面的交线确定，等价于两平面法向的叉积方向（可用克莱默法则求交线方向）。"
    provenance: "2023国赛B|多波束测深合理探测方案的设计及效果分析|B477"

  - name: 最大覆盖宽度方向
    template: "固定深度与开角时，覆盖宽度作为航向方向的函数在‘测线方向与当地梯度垂直（沿等高线）’处取最大值；不同方向的覆宽分布可抽象为圆锥被斜面斜截、水平投影为椭圆、长轴对应最大覆宽的几何结构。"
    provenance: "2023国赛B|多波束测深合理探测方案的设计及效果分析|B477"

  - name: 相邻测线递推关系
    template: "在给定重叠率下，下一条测线的深度由前一条测线深度、坡度、开角与重叠率经递推式唯一确定；由递推式反解测线间距，从边界逐条生成覆盖全海域的测线族，并比较从深/浅两端迭代的多测面积以选定迭代起点。"
    provenance: "2023国赛B|多波束测深合理探测方案的设计及效果分析|B477"

  - name: 局部平坦化近似（微分思想）
    template: "当地形变化尺度远大于单次探测覆盖尺度时，把每点邻域近似为平面，用该点的深度、坡度、开角作为局部参数替代全局曲面，使曲面问题逐点退化为平面问题，并按梯度方向跃迁到下一测线。"
    provenance: "2023国赛B|多波束测深合理探测方案的设计及效果分析|B477"

  - name: 分段基元轮廓的解析参数提取
    template: "若待测轮廓由若干标准几何基元(直线段、圆弧)拼接而成,则对每个基元按其解析形式拟合,相邻基元函数联立解得拼接点坐标,几何参数(长度、半径、弧长、夹角)均可由拟合系数与拼接点解析计算"
    provenance: "2020国赛D|接触式轮廓仪校准问题|2020D"

  - name: 特征点对齐的多测合并
    template: "对同一物体多次测量所得点集,若每次测量差异仅为刚体位移,选取稳定特征点(如极值点)计算各点集到基准的平移向量并施加平移,使点集重合后合并拟合,可获得比单次测量更稳的参数估计"
    provenance: "2020国赛D|接触式轮廓仪校准问题|2020D"

  - name: 平行线簇斜率平均估计刚体旋转角
    template: "若刚体在平面内仅旋转小角度,其上多条可辨识直线的斜率携带同一旋转信息;对各直线斜率反三角函数估计求平均以抵消测量噪声,得到旋转角估计,再以旋转矩阵对坐标施加逆旋转完成校正"
    provenance: "2020国赛D|接触式轮廓仪校准问题|2020D"

  - name: 简化假设误差的归因验证
    template: "当简化假设(如将椭圆截面近似为圆)导致模型结果与标准值有偏差时,构造不同变换状态下截面的几何形态逐一比对,判定实际状态,从而把参数差异归因于假设而非算法错误"
    provenance: "2020国赛D|接触式轮廓仪校准问题|2020D"

  - name: 受迫振动周期一致性
    template: "简谐激励下的线性阻尼系统进入稳态后，响应周期逼近激励周期；可用相邻过零时刻间距的方差作为模型正确性的检验量"
    provenance: "2022国赛A|波浪能装置输出功率优化设计|A001"

  - name: 稳态区间平均指标
    template: "对含瞬态与稳态两阶段的动力学过程，取稳态之后的时间窗计算平均性能指标，可消除初值瞬态对目标的干扰"
    provenance: "2022国赛A|波浪能装置输出功率优化设计|A001"

  - name: 梯形离散积分近似
    template: "连续积分型目标函数可用足够小步长的梯形面积求和近似，离散误差随步长可控，便于嵌入数值求解流程"
    provenance: "2022国赛A|波浪能装置输出功率优化设计|A001"

  - name: 组合体转动惯量合成
    template: "组合刚体对任意轴的转动惯量等于各分块对质心轴惯量之和加上各分块质量乘轴距平方（平行移轴+垂直轴定理）"
    provenance: "2022国赛A|波浪能装置输出功率优化设计|A001"

  - name: 线性系统稳态频响
    template: "受简谐激励的线性阻尼多自由度系统,暂态项按指数衰减后,各广义坐标稳态响应的圆频率等于激励圆频率,可把微分方程组化为频域复数代数方程求解稳态幅值"
    provenance: "2022国赛A|波浪能装置输出功率最大化模型|A022"

  - name: 平均功率数值积分
    template: "以阻尼系数与相对运动速度平方之积为瞬时功率,选取进入稳态后的时段对瞬时功率做梯形数值积分并除以时长,得到平均功率作为优化目标"
    provenance: "2022国赛A|波浪能装置输出功率最大化模型|A022"

  - name: 小量解耦与整体化
    template: "当耦合自由度的角位移与相对位移均为一阶小量时,可将运动方程按自由度解耦:平动部分忽略转角影响,转动部分把两刚体合并为整体后,再在平动非惯性系中分解单个刚体的运动"
    provenance: "2022国赛A|波浪能装置输出功率最大化模型|A022"

  - name: 全局-局部两阶段寻优
    template: "对决策参数先以粗网格全域遍历得到目标函数曲面,依据曲面单调性或峰值区域收缩搜索区间,再在缩小区间细网格采样逼近最优点"
    provenance: "2022国赛A|波浪能装置输出功率最大化模型|A022"

  - name: 基于方位角的三角定位模型
    template: "若目标点与两个已知基准点的夹角观测可测,由正弦定理可将目标极坐标(ρ,θ)表示为角度观测的解析函数;观测含偏差时,对偏差域遍历可得目标位置的可行集合"
    provenance: "2022国赛B|无人机遂行编队飞行中的纯方位无源定位|B030"

  - name: 对称性归并的分类讨论
    template: "当几何构型按相对位置形态分类时,若两类形态可通过旋转/镜像变换重叠且解析式互通,可归并为一类,在保持覆盖完整的前提下减少模型数量"
    provenance: "2022国赛B|无人机遂行编队飞行中的纯方位无源定位|B030"

  - name: 分层解耦的迭代调整方案
    template: "对多目标位置调整问题,若位置由多个坐标分量决定且相互影响弱,可按'先调基准子集→以基准为参照逐目标调整单一分量→迭代至收敛'的顺序设计,每步保持闭式解"
    provenance: "2022国赛B|无人机遂行编队飞行中的纯方位无源定位|B030"

  - name: 蒙特卡洛式有效性验证
    template: "当模型输入含随机偏差时,按偏差分布随机生成大量样本,统计输出与真值的平均偏差与准确率,以阈值判定定位/调整有效性,结论具有统计可靠性"
    provenance: "2022国赛B|无人机遂行编队飞行中的纯方位无源定位|B030"

  - name: 定长张角轨迹定位
    template: "已知两定点与一固定张角，动点轨迹为过两定点的圆弧；两组（定点，张角）对应的轨迹圆弧交点中除公共已知点外的另一交点即待定位点"
    provenance: "2022国赛B|基于计算几何与带阈值启发式搜索的无人机无源定位模型|B035"

  - name: 误差角度区间无交集判定
    template: "当观测点误差导致的张角变化不超过某阈值时，不同编号假设对应的角度观测区间互不相交，即可由实测角度唯一确定信号来源编号"
    provenance: "2022国赛B|基于计算几何与带阈值启发式搜索的无人机无源定位模型|B035"

  - name: 前视启发式搜索统一框架
    template: "以估价函数衡量局面优劣的多步前瞻决策树搜索：前瞻步长为1时退化为贪心，增大步长可避免局部最优并提高收敛精度"
    provenance: "2022国赛B|基于计算几何与带阈值启发式搜索的无人机无源定位模型|B035"

  - name: 共线共圆退化规避
    template: "当定位基准点出现共线或共圆时定位精度退化，可通过预先约定发射顺序与判定退化情形跳过调整来规避"
    provenance: "2022国赛B|基于计算几何与带阈值启发式搜索的无人机无源定位模型|B035"

  - name: 正九边形圆周角与伪圆周角规律引理
    template: "正n边形内接于圆时，圆心角呈离散倍数，对应的圆周角与伪圆周角均可表为该离散量的简单线性组合，从而由接收方位角集合唯一确定信号源编号"
    provenance: "2022国赛B|基于局部最优模型的无人机位置调整策略与仿真定位|B086"

  - name: 三点可微调为正三角形引理
    template: "给定近似正三角形的三点及一边附近的点，通过控制夹角目标值（平角与60°）分三步微调，可使三角形严格为正且该点落在指定边上"
    provenance: "2022国赛B|基于局部最优模型的无人机位置调整策略与仿真定位|B086"

  - name: 定比分点与中心对齐引理
    template: "通过控制待调点与固定点形成的夹角（定比分角或120°费马条件），可将点调至边上的指定比例位置或正三角形中心"
    provenance: "2022国赛B|基于局部最优模型的无人机位置调整策略与仿真定位|B086"

  - name: 径向预处理缩小误差引理
    template: "沿径向调整使接收方向角达到理想值，由正弦定理可证距离误差从较大范围缩小至规定容差内，从而减少后续搜索次数"
    provenance: "2022国赛B|基于局部最优模型的无人机位置调整策略与仿真定位|B086"

  - name: 链式速度比例不变性
    template: "若刚性链各单元间的速度约束为线性齐次投影关系（如沿杆方向速度投影相等），则驱动端速度缩放k倍时，链上任意点的速度同倍率缩放k倍，全链最大速度也随之同倍率缩放。"
    provenance: "2024国赛A|基于几何模型的舞龙队位置和速度分析|A016"

  - name: 相切双圆弧弧长不变量
    template: "两圆弧分别与中心对称螺线相切且彼此相切，当两圆弧半径保持固定比例且相切点共线约束成立时，总弧长仅由两半径之和与公共张角决定，不随半径比例调整而改变。"
    provenance: "2024国赛A|基于几何模型的舞龙队位置和速度分析|A016"

  - name: 步长折半逼近误差界
    template: "对单调目标函数用步长折半法求根，以步长小于给定阈值epsilon为停止准则时，解的绝对误差不超过2倍epsilon。"
    provenance: "2024国赛A|基于几何模型的舞龙队位置和速度分析|A016"

  - name: 串联刚体链路径跟踪递推
    template: "对首节点轨迹已知、相邻节点间距恒定的串联刚体链，后序节点位置由『以当前节点为圆心、间距为半径的圆』与『路径曲线的交点』递推确定；多解时按路径单调方向筛选，取沿行进方向最邻近的交点。"
    provenance: "2024国赛A|基于自标优化的板凳龙形态调节|A053"

  - name: 滞后链首次碰撞前移引理
    template: "若链上每个后随节点严格重复其前导节点的历史轨迹（滞后性），则任一非首节点发生碰撞之前，其前导节点必然更早发生碰撞；递推可得全链首次碰撞必发生在首节点，据此可只检测首节点附近的局部结构。"
    provenance: "2024国赛A|基于自标优化的板凳龙形态调节|A053"

  - name: 凸多边形碰撞的分离轴判定
    template: "两凸多边形不相交当且仅当存在一条轴使二者在其上的投影区间不重叠；对矩形可取邻边方向单位向量为投影轴，用区间端点比较不等式判定重叠，并以0/1跳变指示函数封装『恰好碰撞』的临界时刻。"
    provenance: "2024国赛A|基于自标优化的板凳龙形态调节|A053"

  - name: 极限可行域边界等效转化
    template: "求某参数最小化以使过程恰好满足可达性时，把『恰好满足』的状态置于可行域边界（如圆形边界与路径曲线的交点），将动态全程约束等价为边界点约束；再以大步长定位加小步长精化的变步长遍历求解一维参数。"
    provenance: "2024国赛A|基于自标优化的板凳龙形态调节|A053"

  - name: 恒速质点沿参数曲线的位置-时间关系
    template: "质点以恒定速率沿已知参数曲线运动时，走过的弧长与时间成正比；通过弧长积分建立时间与曲线参数（如极角）的单调对应关系，反解参数并经坐标变换即可得到任意时刻位置。"
    provenance: "2024国赛A|基于几何模型的板凳龙运动路径问题|A163"

  - name: 定长链的逐节位置递推
    template: "相邻刚体由定长连接时，给定前一点的位置与所在曲线方程，用余弦定理建立关于后一点曲线参数的隐式方程，数值求根后逐节递推，可得整条链的构型。"
    provenance: "2024国赛A|基于几何模型的板凳龙运动路径问题|A163"

  - name: 刚体关联速度递推
    template: "同一刚体上两点沿连体方向的速度分量相等；结合两点各自速度方向（所在曲线切线方向）与连线方向的夹角，可由一点的已知速度递推另一点的速度。"
    provenance: "2024国赛A|基于几何模型的板凳龙运动路径问题|A163"

  - name: 特征点到连线距离的碰撞判据
    template: "对形状已知的刚体，碰撞检测可化为特征角点到邻近刚体连接线距离与半板宽的比较；配合形状与路径的相同性，只需检测少数关键刚体的角点。"
    provenance: "2024国赛A|基于几何模型的板凳龙运动路径问题|A163"

  - name: 刚性链沿参数曲线递推定位命题
    template: "设刚性链相邻节点间距固定且均位于已知参数曲线上，已知当前节点参数，则下一节点参数由“两点坐标距离等于链长”的等式解出（取满足运动方向或单调性约束的根），逐节递推即得整链构型。"
    provenance: "2024国赛A|板凳龙表演的行进路径与速度控制|A178"

  - name: 不可伸长连杆分速度连续命题
    template: "若连杆刚性不可伸长，则相邻两节点沿连杆方向的速度分量相等；把两节点速度分别沿连杆单位方向投影并令相等，即得相邻节点速度的递推关系。"
    provenance: "2024国赛A|板凳龙表演的行进路径与速度控制|A178"

  - name: 点在凸四边形内叉积判定命题
    template: "将凸四边形沿对角线剖分为两个三角形；点位于四边形内当且仅当落在某个三角形内；点位于三角形内可判定为三个“顶点到点”向量两两叉积同号。"
    provenance: "2024国赛A|板凳龙表演的行进路径与速度控制|A178"

  - name: 相切双圆弧转向曲线长度不变性命题
    template: "两段相切圆弧（半径比固定）构成的转向曲线，其圆心角由两圆弧公共切点处的几何关系唯一确定；当进入转向点固定时圆心角恒定，弧长等于圆心角乘以半径和而不变，只有改变进入点（调头半径）或半径比例才能缩短弧长。"
    provenance: "2024国赛A|板凳龙表演的行进路径与速度控制|A178"

  - name: 等距螺线匀速运动的位置-时间关系
    template: "质点沿等距螺线以恒定速率运动时，其极角满足可分离变量的一阶微分方程(弧长微元=速率×时间)，积分得极角关于时间的隐函数，右端关于极角单调保证解唯一，可用二分法数值求反函数。"
    provenance: "2024国赛A|基于动态搜索的“板凳龙”运动状态及路线研究|A242"

  - name: 刚性铰接链的余弦定理递推
    template: "由固定长度刚性杆首尾铰接的链，已知相邻铰点间距与一个铰点的极坐标，由余弦定理可反解另一铰点的极角；对该递推式对时间求导得到角速度与速度的递推关系，从而由源头逐节外推整条链的位置与速度。"
    provenance: "2024国赛A|基于动态搜索的“板凳龙”运动状态及路线研究|A242"

  - name: 角点-轴线距离碰撞判据
    template: "两个带宽度刚体的碰撞可等价为：一个刚体的外角点到另一个刚体轴线(两铰点所在直线)的距离小于半宽阈值；该距离是时间的连续函数，其首次跌破阈值的时刻即碰撞时刻，可用两级搜索(粗搜+二分)定位。"
    provenance: "2024国赛A|基于动态搜索的“板凳龙”运动状态及路线研究|A242"

  - name: 速度比例缩放等价性
    template: "若整条运动链上各点速度在相同构型下与驱动点速度成固定比例，则在限速约束下的最大驱动速度等于限速除以基准工况下所有点速度的最大比例值，即把参数优化转化为基准工况下的极值查找加一次比例还原。"
    provenance: "2024国赛A|基于动态搜索的“板凳龙”运动状态及路线研究|A242"

  - name: 首件合格品期望成本分解
    template: "当每件产品独立以概率q合格时，产出第一件合格品所需制造次数服从几何分布；制造一件合格品的期望总成本=单次制造期望成本×期望次数+与调换/拆解次数相关的惩罚项，可用0-1示性变量统一表达不同检测策略组合"
    provenance: "2024国赛B|生产过程中的决策优化设计|B159"

  - name: 检验效果-成本权衡决策函数
    template: "以假设检验功效函数对参数先验取期望作为检验效果度量，与线性检测成本加权组合成决策函数，求极值确定最优样本量；权重反映决策者对效果与成本的偏好"
    provenance: "2024国赛B|生产过程中的决策优化设计|B159"

  - name: 后验积分下的期望决策
    template: "当决策指标为参数θ的函数h(θ)而θ服从后验分布π(θ|x)时，期望指标=∫h(θ)π(θ|x)dθ；选择共轭先验使后验闭式可积，将离散点估计决策扩展为分布意义下的期望决策"
    provenance: "2024国赛B|生产过程中的决策优化设计|B159"

  - name: 状态-决策贝尔曼递推
    template: "多阶段决策问题中状态由（检测状态,质量状态）刻画，最优值函数满足V(S)=max_a[R(S,a)−C(a)+E[V(T(S,a))]]，其中R为当前收益、C为当前成本、T为状态转移函数；用记忆化动态规划避免重复计算"
    provenance: "2024国赛B|生产过程中的决策优化设计|B159"

  - name: 多阶段流程决策编码原理
    template: "凡决策点形如'是否执行某操作'的多阶段流程，均可把每个决策点映射为0-1变量，并将全流程期望收益写成各阶段条件期望的组合，从而化为单目标整数规划；变量多时可先做业务逻辑约简，再连续松弛后用随机全局搜索算法求解，并检验最优解的端点性质"
    provenance: "2024国赛B|基于多阶段模拟仿真的生产决策问题|B195"

  - name: 计数抽样方案的正态近似求解条件
    template: "给定两类错误概率上界的计数抽样问题，当样本量充分大时，二项分布可由正态分布近似，原概率约束转化为关于标准正态分位数的代数不等式，据此可枚举或直接解出最小样本量与接受判据数"
    provenance: "2024国赛B|基于多阶段模拟仿真的生产决策问题|B195"

  - name: 共轭先验与后验回代稳健性检验
    template: "当模型参数由抽样估计而非精确已知时，选取与似然函数共轭的先验分布使后验解析可求；取后验置信区间端点回代原优化模型，若最优决策不变，则结论对参数扰动稳健"
    provenance: "2024国赛B|基于多阶段模拟仿真的生产决策问题|B195"

  - name: 含回收环节流程的循环收敛判据
    template: "含再利用回收环节的生产流程可按轮次迭代模拟，把上一轮末尾的再处理步骤并入下一轮起始，并以相邻两轮总收益比值低于某阈值（如1.001）作为收敛条件，保证有限轮内终止"
    provenance: "2024国赛B|基于多阶段模拟仿真的生产决策问题|B195"

  - name: 方差未知时的抽样检验样本量反解
    template: "当总体比例仅知标称期望而方差未知时，以样本标准差构造t型统计量做单侧假设检验；由显著性水平对应分位数导出样本量n与可接受次品数k的约束关系，在均值误差允许范围内取最小n与最大k"
    provenance: "2024国赛B|基于蚁群算法与遗传算法优化的蒙特卡洛模拟在生产决策优化中的应用研究|B196"

  - name: 装配流数量守恒递推
    template: "任一环节进入下一环节的合格品数量=该环节输入数量×(1−次品率×检测决策)；半成品/成品数量由下层合格品数层层合成，收益=合格成品销量×售价"
    provenance: "2024国赛B|基于蚁群算法与遗传算法优化的蒙特卡洛模拟在生产决策优化中的应用研究|B196"

  - name: 闭环反馈线性化
    template: "对含拆解回收与退换货的流程，把“不合格品经拆解重新进入检测”“退回品重新归类为次品”展开为显式分支，使闭环决策结构转化为无环决策树后再求解"
    provenance: "2024国赛B|基于蚁群算法与遗传算法优化的蒙特卡洛模拟在生产决策优化中的应用研究|B196"

  - name: 启发式搜索收敛判定
    template: "以目标函数值为适应度记录每代最优个体，当最优适应度连续若干代不再提升时判定算法收敛，并将对应个体作为近似最优解"
    provenance: "2024国赛B|基于蚁群算法与遗传算法优化的蒙特卡洛模拟在生产决策优化中的应用研究|B196"

  - name: 极值点相位差恒定性质
    template: "当薄膜吸收较弱时，反射谱相邻极值（波峰/波谷）对应的往返相位差恒为2π，据此由相邻极值点波数差与折射率、入射角反解膜厚显式公式"
    provenance: "2025国赛B|红外干涉法测量外延层厚度的建模分析|B060"

  - name: 双光束等效反射率还原修正公式
    template: "多光束（Airy）等效反射振幅与双光束反射振幅之间由几何级数分母项关联，可由实测反射率乘以含界面菲涅尔系数与往返相位因子的校正项还原出双光束等效反射率，再在其上重新反演"
    provenance: "2025国赛B|红外干涉法测量外延层厚度的建模分析|B060"

  - name: 多光束效应显著性G值判据
    template: "定义无量纲量G为界面反射系数乘积与膜内往返衰减因子之模，双光束与多光束模型反射率最坏相对偏差约为2G，据此给出G<0.01/0.05/0.1对应模型差异不超过约2%/10%/20%的定量判据"
    provenance: "2025国赛B|红外干涉法测量外延层厚度的建模分析|B060"

  - name: 极值点噪声误差传导定理
    template: "在小噪声加局部二次近似下，反射谱极值位置估计的随机误差一阶主导正比于噪声导数方差与真实曲线二阶导数平方之比，二阶导越小误差放大越严重，多光束模型因极值附近二阶导更小而更敏感"
    provenance: "2025国赛B|红外干涉法测量外延层厚度的建模分析|B060"

  - name: 两光束干涉测厚模型
    template: "入射光在薄膜两界面各反射一次产生相位差，总反射率为两束反射干涉叠加，厚度可由反射率随波数振荡的周期反演，界面反射系数由Fresnel公式给出"
    provenance: "2025国赛B|碳化硅外延层厚度的双光束和多光束干涉法测量研究|2025_B_B157"

  - name: Airy多光束干涉模型
    template: "多束反射振幅按几何级数求和得Airy型反射率，条纹锐度由锐度系数决定，厚度主周期与两光束一致但极值位置与线形发生改变"
    provenance: "2025国赛B|碳化硅外延层厚度的双光束和多光束干涉法测量研究|2025_B_B157"

  - name: 多光束显著性判据
    template: "光源相干长度不小于往返光程差、界面反射率乘积不过小使锐度系数足够大、介质吸收弱、光束平行且模角小，是产生显著多光束干涉的必要条件"
    provenance: "2025国赛B|碳化硅外延层厚度的双光束和多光束干涉法测量研究|2025_B_B157"

  - name: 分叉平均分流的漫延推演
    template: "当传播介质在节点分叉且各支路同等接收流量时,节点处流量按支路数平均分配,每条巷道铺满时间由巷道体积与分配流量之比决定;按最短铺满时间次序扩张已覆盖节点集合,可推演出整个网络上的到达时序"
    provenance: "2025国赛D|矿井突水水流漫延模型与逃生方案问题|D037"

  - name: 动态网络时间离散化
    template: "当最短路径边权随时间变化时,将时间线离散为若干时间步,每个时间步内网络状态视为静态,把动态网络最短路转化为分段静态最短路,从而复用经典Dijkstra算法"
    provenance: "2025国赛D|矿井突水水流漫延模型与逃生方案问题|D037"

  - name: 多源叠加的封闭重分配
    template: "当多个传播源的波前在边/节点相遇时视为形成封闭,将已满巷道从网络中移除,其流量按比例重新分配给相邻未满巷道,使多源问题分解为各自独立传播加局部叠加"
    provenance: "2025国赛D|矿井突水水流漫延模型与逃生方案问题|D037"

  - name: 顺逆水速度建模
    template: "逃生者在含水流巷道中的速度取决于行进方向与流向关系:顺水取较高速、逆水取较低速、无水取正常速度;把水流状态转化为路径边权后纳入最短路求解"
    provenance: "2025国赛D|矿井突水水流漫延模型与逃生方案问题|D037"

theory_checks:
  - name: 推导链完整性
    note: "从守恒律/本构关系到最终方程，不许跳步（see WR-045 Step 组织）"
    required: true
  - name: 定解条件完备性
    note: "初值+边界齐全，适定性讨论"
    required: true
  - name: 数值稳定性
    note: "离散格式给稳定性条件（CFL/显式隐式），或给网格收敛性验证"
    required: false
  - name: 退化/极限验证
    note: "参数退化到已知情形应复现已知结果"
    required: false

antipattern:
  bad: "采用 COMSOL 有限元仿真模拟温度场，得到温度分布如图。（无方程、无机制拆解、无边界条件说明、无稳定性讨论）"
  good: "由能量守恒与傅里叶定律推导一维热传导方程 ρc_p∂T/∂t = k∂²T/∂x²，初边值条件 T(0,t)=T_w, T(x,0)=T_0；隐式差分离散（无条件稳定），网格 0.1mm 收敛性验证；τ 由实测曲线最小二乘标定，拟合误差 3.2%。"

failure_modes:
  - mode: wrong_abstraction
    symptom: "把机理题当成纯数据拟合题，跳过物理结构直接上回归/神经网络"
    guard: "机制拆解先行：先列主导机制与守恒关系，再决定是否需要数据层"
  - mode: over_modeling
    symptom: "一阶问题硬上 PDE/多物理场耦合，参数不可辨识"
    guard: "由简到繁（see WR-235）：先理想模型再逐步引入修正，每层修正有数据或物理依据"
  - mode: unnecessary_theory
    symptom: "非线性系统硬写线性稳定性判据，或写与方程无关的定理"
    guard: "理论性质与方程类型匹配（线性/非线性、常/偏微分）"
  - mode: forced_equation
    symptom: "为凑公式硬造方程，量纲不齐（see WR-014 单位闭环）"
    guard: "量纲检查：方程每项量纲一致；公式被后续引用"

readability_guard:
  - "每个方程推导前用一句中文说明物理直觉（为什么要这样建立）"
  - "方程中每个符号首现带含义（即使符号表已定义）"
  - "连续公式不超过 3 个，第 4 个前插入解释段落"
  - "数值结果必须与机理解释对应（为什么这个参数导致这个行为）"

# 失败经验 schema（贡献者填这个）
# 发布版只公开此 schema；真实数据进 private/community。

schema:
  failure_id: FD-xxx
  problem_type: 组合优化 / 预测 / 评价 / 微分方程 / 图论 ...
  method: 用了什么方法
  failure: 失败表现（结果/现象）
  cause: 根因
  signal: 可复现的预警信号（什么现象=要出事）
  lesson: 一句话教训
  avoid: 下次避免什么
  evidence: 关联数据/结果（可选）

  # ---- 来源类型与质量评分（字段缺省时自动补默认值）----
  memory_type: llm_extract / paper_extract / human_replay / theory
  quality_score:
    source_quality: 高 / 中 / 低     # 来源质量（真实可溯 > 推测）
    confidence: 高 / 中 / 低          # 置信度
    verified: true / false            # 是否被真实比赛验证
    reuse_count: 0                    # 被检索复用次数
    success_rate: null                # 复用后成功率 0~1（未统计=null）

# 缺省值（字段缺失时自动补，不改已有数据）
defaults:
  memory_type: paper_extract
  quality_score: {source_quality: 中, confidence: 中, verified: false, reuse_count: 0, success_rate: null}

# 示例（模板，非真实）
example: |
  failure_id: FD-999
  problem_type: 预测
  method: LSTM
  failure: 效果低于 baseline
  cause: 样本不足
  signal: 训练集 < 1000
  lesson: 小样本优先统计模型
  avoid: Transformer
  memory_type: human_replay
  quality_score: {source_quality: 高, confidence: 高, verified: true, reuse_count: 3, success_rate: 1.0}

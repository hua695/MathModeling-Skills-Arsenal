    required_sections: [思路, 网络定义, 模型, 求解, 结果]
    required_evidence: [assumptions, variable_definition, derivation, algorithm, result, reliability]
    independent_paths: {required: false, examples: [图算法, 优化模型]}
    algorithm: [selection_reason, graph_construction, complexity]
    reliability: [perturbation_or_sensitivity, structural_stability]
    enhanced_evidence: [node_edge_definition, weight_meaning, complexity_analysis]
  uncertainty:
    model_keywords: [不确定性, 情景, 分布, 置信区间, 风险]

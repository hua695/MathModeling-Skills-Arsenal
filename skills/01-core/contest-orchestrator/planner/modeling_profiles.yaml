    required_sections: [思路, 不确定性来源, 传播方法, 结果]
    required_evidence: [assumptions, uncertainty_source, result, reliability]
    independent_paths: {required: false, examples: [扰动分析, 蒙特卡洛]}
    algorithm: [selection_reason, scenario_design, seed_or_repetition]
    reliability: [confidence_interval, robustness_check, sensitivity_or_cross_validation]
    enhanced_evidence: [distribution_or_scenario, coverage_statement]
  clustering:
    model_keywords: [特征标准化, 簇数, 距离度量, 聚类算法, 簇画像]

schema_version: "2.0"
default_profile: mechanistic_optimization
profiles:
  mechanistic_optimization:
    model_keywords: [目标函数, 约束, 可行域, 算法, 优化, 参数边界]
    result_keywords: [最优, 求解结果, 配置方案, 目标值]
    required_sections: [思路, 假设, 模型, 求解, 结果]
    required_evidence: [assumptions, derivation, algorithm, result, reliability]
    independent_paths: {required: false, when: mechanistic_inversion, examples: [解析/直接计算, 数值拟合/迭代]}
    algorithm: [selection_reason, initialization_or_range, termination, constraint_handling]
    reliability: [perturbation_or_sensitivity, residual_or_error]
    enhanced_evidence: [route_comparison, algorithm_card, intermediate_results]
  data_prediction:
    model_keywords: [特征工程, 训练集, 测试集, 评价指标, 交叉验证, 超参数]
    result_keywords: [预测结果, RMSE, MAE, R2, 泛化]
    required_sections: [思路, 数据, 模型, 求解, 结果]
    required_evidence: [assumptions, preprocessing, baseline, split, metrics, reliability]
    independent_paths: {required: false, examples: [统计基线, 机器学习模型]}
    algorithm: [selection_reason, hyperparameter_strategy, termination]
    reliability: [residual_or_error, sensitivity_or_cross_validation]
    enhanced_evidence: [route_comparison, algorithm_card, intermediate_results]
  evaluation_decision:
    model_keywords: [指标体系, 权重, 排名, 正向化, 归一化, 决策]
    result_keywords: [排序, 权重, 方案比较, 稳定性]
    required_sections: [思路, 指标, 权重, 求解, 结果]
    required_evidence: [assumptions, indicator_meaning, weight_source, result, reliability]
    independent_paths: {required: false, examples: [主观权重, 客观权重]}
    algorithm: [normalization, weight_strategy, ranking_rule]
    reliability: [weight_sensitivity, ranking_stability]
    enhanced_evidence: [route_comparison, algorithm_card, intermediate_results]
  simulation_dynamics:
    model_keywords: [状态方程, 动力学, 初值, 边界条件, 数值积分, 场景]
    result_keywords: [仿真结果, 稳态, 瞬态, 场景对比]
    required_sections: [思路, 状态方程, 初值, 求解, 结果]
    required_evidence: [assumptions, derivation, initial_boundary, numerical_method, result, reliability]
    independent_paths: {required: false, examples: [解析解, 数值积分]}
    algorithm: [solver_choice, step_or_tolerance, stability_check]
    reliability: [step_sensitivity, conservation_or_residual]
    enhanced_evidence: [route_comparison, algorithm_card, intermediate_results]
  hybrid:
    model_keywords: [子问题, 模型组合, 接口变量, 约束, 验证]
    result_keywords: [子问题结果, 综合结果, 鲁棒性]
    required_sections: [思路, 接口, 模型, 求解, 结果]
    required_evidence: [assumptions, derivation, algorithm, result, reliability, interface]
    independent_paths: {required: false, examples: [分解求解, 联合求解]}
    algorithm: [selection_reason, interface_handling, termination]
    reliability: [perturbation_or_sensitivity, cross_model_consistency]
    enhanced_evidence: [route_comparison, algorithm_card, intermediate_results]
  # These profiles are capability modules, not contest-slot templates. They are
  # selected per subproblem by planner/paper_profiles.yaml.
  statistical_inference:
    model_keywords: [效应量, 置信区间, 假设检验, 残差诊断, 重复测量]
    result_keywords: [效应量, 置信区间, p值, 残差, 稳健性]
    required_sections: [思路, 数据结构, 指标, 推断, 结果]
    required_evidence: [assumptions, preprocessing, indicator_meaning, result, reliability]
    independent_paths: {required: false, examples: [参数法, 非参数法]}
    algorithm: [selection_reason, estimator_or_test, assumptions_check]
    reliability: [confidence_interval, residual_or_error, sensitivity_or_robustness]
    enhanced_evidence: [row_grain, repeated_measure_handling, effect_size]
  classification:
    model_keywords: [类别不平衡, 训练集, 测试集, 混淆矩阵, 阈值, 校准]
    result_keywords: [准确率, 精确率, 召回率, F1, AUC, 校准]
    required_sections: [思路, 数据, 分类模型, 阈值, 结果]
    required_evidence: [assumptions, preprocessing, split, baseline, metrics, result, reliability]
    independent_paths: {required: false, examples: [统计基线, 分类器]}

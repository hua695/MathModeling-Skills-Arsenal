    reliability: [cluster_stability, perturbation_or_sensitivity]
    enhanced_evidence: [cluster_number_selection, cluster_profile]
  causal_correlation:
    model_keywords: [相关系数, 偏相关, 混淆变量, 显著性, 效应量]

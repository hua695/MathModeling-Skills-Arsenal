# 决策记忆 schema（贡献者填这个）
# 决策 = 记录"为什么这么做"，是赛后复盘和未来 Planner 蒸馏的最重要数据源

schema:
  decision_id: DM-xxx
  phase: 阶段（problem-parser / planning / solving / writing / review）
  problem_type: 组合优化 / 预测 / 评价 / 微分方程 / 图论 ...
  decision: 做了什么选择
  context: 当时的情况（题型/数据/剩余时间/已有失败）
  alternatives: 放弃了什么
  reason: 为什么这么选
  result: 结果/影响

  # ---- v3.4 经验智能化：来源类型 + 质量评分（向后兼容，缺省自动补默认值）----
  memory_type: llm_extract / paper_extract / human_replay / theory
  quality_score:
    source_quality: 高 / 中 / 低     # 来源质量（真实可溯 > 推测）
    confidence: 高 / 中 / 低          # 置信度
    verified: true / false            # 是否被真实比赛验证
    reuse_count: 0                    # 被检索复用次数
    success_rate: null                # 复用后成功率 0~1（未统计=null）

# 缺省值（旧条目无字段时自动补，不改历史数据）
defaults:
  memory_type: paper_extract
  quality_score: {source_quality: 中, confidence: 中, verified: false, reuse_count: 0, success_rate: null}

# 示例（模板）
example: |
  decision_id: DM-999
  phase: solving
  problem_type: 多目标优化
  decision: 用 NSGA-II
  context: 多目标 + 数据中等 + 时间40h
  alternatives: Transformer
  reason: 可解释性更强
  result: 得分91
  memory_type: human_replay
  quality_score: {source_quality: 高, confidence: 高, verified: true, reuse_count: 4, success_rate: 1.0}

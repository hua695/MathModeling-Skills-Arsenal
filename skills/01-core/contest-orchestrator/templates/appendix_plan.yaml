source_inputs:
  program_used: false
  # 程序题：论文附录展示核心代码，支撑材料保留完整可运行源码。
  # 可选值：not_applicable、core_only、full_source。
  appendix_code_mode: "not_applicable"
  core_source_files: []
  full_source_files: []
  support_source_files: []
  long_derivation_files: []

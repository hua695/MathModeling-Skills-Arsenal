          canvas_profile: {orientation: horizontal, target_layout: single, top_level_node_limit: 7}
      - slot_id: Q1-result-evidence
        category: result_evidence
        disposition: required
        reader_question: <读者需要通过什么视觉证据判断主要结果>
        reader_gain: <图中应显出趋势、比较、分布或方案差异>
        evidence_refs: [<冻结结果定位>]

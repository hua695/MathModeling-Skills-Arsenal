          reader_question: <读者如何从图中判断主要结果>
          explanatory_relation: <冻结结果中的比较、趋势、分布或方案差异>
          must_show: [<指标、比较基准、必要分组或不确定性信息>]
          must_not_show: [<未使用的指标、无意义分类连线或未经核验的数值>]

          pre_text_function: <明确指标与比较基准>
          post_text_function: <解释主要模式、决策意义与适用边界>
          generation_route: modelviz
          template_status: native
          template_id: <SciPilot/ModelViz 选定的实际模板 ID>
          visible_element_map:
            - {element: <冻结结果指标>, role: mark, evidence_refs: [<对应结果证据定位>]}
            - {element: <比较或趋势关系>, role: relation, evidence_refs: [<对应结果证据定位>]}
          canvas_profile: {orientation: horizontal, target_layout: single, top_level_node_limit: 7}
      - slot_id: Q1-validation
        category: validation_robustness
        disposition: required
        reader_question: <读者需要如何判断结果可靠或稳健>
        reader_gain: <图中应显出验证、敏感性或稳健性证据>
        evidence_refs: [<验证或敏感性报告定位>]
        planned_figure_ids: [fig-q1-validation]
        information_unit_ids: [Q1-U01, Q1-U02]
        density_profile: standard
        representation:
          mode: figure
          reason: <为什么可靠性证据需要图示>
          pre_text_role: <图前正文需要先交代验证对象和判据>
          post_text_role: <图后正文需要解释可靠性和适用边界>
        figure_intent:
          reader_question: <读者如何判断结果可靠或稳健>
          explanatory_relation: <验证对象、扰动因素、基准与响应之间的关系>
          must_show: [<验证对象、判据、基准和冻结结果>]
          must_not_show: [<没有验证依据的可靠性结论或额外实验>]
          body_anchor: <本问模型求解与结果分析小节的验证说明处>
          pre_text_function: <说明验证对象与判据>
          post_text_function: <解释可靠性证据与适用范围>
          generation_route: modelviz
          template_status: native
          template_id: <SciPilot/ModelViz 选定的实际模板 ID>
          visible_element_map:
            - {element: <验证基准与响应>, role: mark, evidence_refs: [<对应验证证据定位>]}
            - {element: <稳健性或敏感性关系>, role: relation, evidence_refs: [<对应验证证据定位>]}
          canvas_profile: {orientation: horizontal, target_layout: single, top_level_node_limit: 7}
      - slot_id: Q1-orientation
        category: orientation
        disposition: recommended
        reader_question: <读者在本小问开始前需要看到什么关系>
        reader_gain: <这张图为读者减少的理解成本>
        evidence_refs: [<上游证据定位>]
        planned_figure_ids: [fig-q1-orientation]
        information_unit_ids: [Q1-U01, Q1-U02]
        density_profile: standard
        representation:
          mode: figure
          reason: <为什么本小问开始前需要方向图>
          pre_text_role: <图前正文需要先交代空间或任务关系>
          post_text_role: <图后正文需要承接的建模问题>
        figure_intent:
          reader_question: <本小问开始前读者需要建立什么空间或任务认识>
          explanatory_relation: <题面对象、输入、约束与待求量之间的关系>
          must_show: [<题面对象、方向、边界或任务关系>]
          must_not_show: [<尚未建立的模型公式、结果数值或无关装饰>]
          body_anchor: <本问标题后的问题引入与建模思路段之后>
          pre_text_function: <建立读者对问题结构的共同认识>
          post_text_function: <承接到本问的建模任务与变量定义>
          generation_route: tech-route-maker
          template_status: native
          template_id: problem-analysis-flow
          visible_element_map:
            - {element: <题面对象或输入>, role: node, evidence_refs: [<对应题面证据定位>]}
            - {element: <约束与待求输出关系>, role: edge, evidence_refs: [<对应任务证据定位>]}
          canvas_profile: {orientation: horizontal, target_layout: single, top_level_node_limit: 7}
      - slot_id: Q1-mechanism
        category: mechanism
        disposition: not_applicable
        reader_question: <是否存在需要展示的机理、空间或几何关系>
        reader_gain: <若无机理图，读者如何理解该关系>
        evidence_refs: [<上游证据定位>]
        rationale: <不适用的可核验理由>
        planned_figure_ids: []
        representation:
          mode: text
          reason: <为何本类别由正文和公式足以表达>

# 题型画像：A/B/C 题号、每个子问题的能力标签（方向三：题型差异化 profile）
problem_slot: B
subproblems:
  Q1:
    capabilities:
    - optimization
    - linear_programming
    inputs:
    - 乘客需求数据
    outputs:
    - 发车间隔
    - 车辆数
  Q2:
    capabilities:
    - optimization
    - network_optimization
    inputs:
    - Q1结果
    - 换乘时间
    outputs:
    - 线路网络结构
  Q3:
    capabilities:
    - optimization
    - sensitivity_analysis
    inputs:
    - Q1/Q2模型
    - 参数范围
    outputs:
    - 灵敏度报告
shared_interfaces:
- name: 乘客需求
  type: matrix
  unit: 人次/小时

schema_version: "1.0"
active_mode: full-contest-harness
reader_evidence_protocol: "1.0"
bootstrap:
  required_skill: superpowers:using-superpowers
  # 每次 superpowers 调用都登记证据：task_id 为 superpowers 实际返回，completed=true 且 status=completed
  invocations:
    - skill: superpowers:using-superpowers
      task_id: <superpowers 返回的 task ID>
      purpose: bootstrap          # H0 激活
      completed: true
      status: completed
      created: [H1]
      agent_ids: {H1: <H1 agent_instance_id>}
    - skill: superpowers:using-superpowers
      task_id: <superpowers 返回的 task ID>
      purpose: spawn_roles        # H1 产出题面后一次性创建全部固定角色
      completed: true
      status: completed
      created: [H5, H6, H7, H8]
      agent_ids:
        H5: <H5 agent_instance_id>
        H6: <H6 agent_instance_id>   # 必须 ≠ H5
        H7: <H7 agent_instance_id>
        H8: <H8 agent_instance_id>
roles:
  主 agent: {kind: controller}
  题意理解 agent: {kind: child}
  解题 agent: {kind: child}
  验证 agent: {kind: child}
  图表 agent: {kind: child}
  论文 agent: {kind: child}
agent_runtime_routes:
  H1: {model: gpt-5.6-terra, reasoning_effort: medium}
  H5: {model: gpt-5.6-sol, reasoning_effort: high}
  H6: {model: gpt-5.6-sol, reasoning_effort: high}
  H7: {model: gpt-5.6-terra, reasoning_effort: medium}
  H8: {model: gpt-5.6-sol, reasoning_effort: high}
# 实例注册表：H1 产出 problem_statement.md 后一次性创建全部固定角色，创建时 preloaded 必须含题面+对应角色预热包。
# 回流复用同一实例时本表不新增，dispatch_records 新增派发记录且 agent_instance_id 不变。
agent_instances:
  H1: {agent_instance_id: <H1 agent_instance_id>, preloaded: [problem_statement.md]}
  H5: {agent_instance_id: <H5 agent_instance_id>, preloaded: [problem_statement.md, references/warmup/h5_solver_warmup.md]}
  H6: {agent_instance_id: <H6 agent_instance_id>, preloaded: [problem_statement.md, references/warmup/h6_verifier_warmup.md]}
  H7: {agent_instance_id: <H7 agent_instance_id>, preloaded: [problem_statement.md, references/warmup/h7_figure_warmup.md]}
  H8: {agent_instance_id: <H8 agent_instance_id>, preloaded: [problem_statement.md, references/warmup/h8_writer_warmup.md, references/h8_writer_first_protocol.md, references/model_summary_protocol.md, references/paper_author_evidence_protocol.md]}
problem_scope:
  subproblems: []
solver_instance_id: null
dispatch_records: []
validation:
  profile: competition_fast
  change_impact_card: null
  full_delivery_gate: H9
nodes:
  H0: {owner_role: 主 agent, agent_policy: controller_only, support_agent_policy: conditional, status: not_started}
  H1: {owner_role: 题意理解 agent, agent_policy: required, support_agent_policy: conditional, problem_statement: null, unified_problem_package: null, status: not_started}
  H2: {owner_role: 主 agent, agent_policy: controller_only, support_agent_policy: conditional, status: not_started}
  H3: {owner_role: 主 agent, agent_policy: controller_only, support_agent_policy: conditional, literature_request: null, literature_agent_prompt: null, literature_sources: null, status: not_started}
  H4: {owner_role: 已并入H5（蓝图设计）, agent_policy: merged_into_h5, support_agent_policy: conditional, note: "H4节点已取消，蓝图设计职责并入H5阶段一", status: merged}
  H5: {owner_role: 解题 agent, agent_policy: required, support_agent_policy: conditional, solver_instance_id: null, method_transfer_map: null, model_blueprint: null, chart_requirements: null, paper_narrative: null, result_interpretation_cards: null, validation_contract: null, model_summary_cards: null, run_manifest: null, sensitivity_report: null, visual_evidence_packet: null, skill_invocations: [], status: not_started}
  H6: {owner_role: 验证 agent, agent_policy: required, support_agent_policy: conditional, verification_scope: null, global_interface_check: null, model_summary_cards: null, visual_evidence_packet: null, skill_invocations: [], status: not_started}
  H7: {owner_role: 图表 agent, agent_policy: required, support_agent_policy: conditional, model_summary_cards: null, visual_evidence_packet: null, visual_argument_plan: null, visual_plan_review_packet: null, figure_registry: null, skill_invocations: [], status: not_started}
  # H8 status 推进后必须登记 academic-writing 与 mathmodel-latex-skill 的实际调用及 evidence_ref。
  H8: {owner_role: 论文 agent, agent_policy: required, support_agent_policy: conditional, paper_material_readiness: null, evidence_gap_matrix: null, paper_claim_coverage: null, visual_argument_plan: null, abstract_argument_card: null, abstract_contract_report: null, abstract_written: false, paper_argument_blueprint: null, paper_author_brief: null, chapter_writing_cards: [], active_chapter_card: null, paper_continuity_context: null, model_summary_cards: null, writing_plan: null, writing_plan_sha256: null, plan_review_packet: null, plan_approved: false, writing_started: false, skill_invocations: [], status: not_started}
  # H9 status 推进后必须登记 bzd-review-paper 与 mathmodel-latex-skill 的实际调用及 evidence_ref。
  H9: {owner_role: 主 agent, agent_policy: controller_only, support_agent_policy: conditional, skill_invocations: [], status: not_started}
